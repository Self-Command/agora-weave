# Explicit administrator password opt-in, applied after the complete official
# Compose and core service overlay. Private BFF and core values must be identical.
# Phone signup and public SMS sending stay closed; the official SQL hook rejects
# any OTP send without a current reserved broker operation.
services:
  auth:
    environment:
      GOTRUE_DISABLE_SIGNUP: 'true'
      GOTRUE_EXTERNAL_EMAIL_ENABLED: 'false'
      GOTRUE_EXTERNAL_PHONE_ENABLED: 'true'
      GOTRUE_SMS_AUTOCONFIRM: 'false'
      GOTRUE_HOOK_SEND_SMS_ENABLED: 'true'
      GOTRUE_HOOK_SEND_SMS_URI: pg-functions://postgres/core/auth_send_sms_hook
  functions:
    environment:
      CORE_PHONE_AUTH_ENABLED: 'false'
      CORE_ADMIN_PASSWORD_AUTH_ENABLED: 'true'
      CORE_ADMIN_PASSWORD_BFF_KEY: ${CORE_ADMIN_PASSWORD_BFF_KEY:?Private administrator BFF signing key required}
      CORE_INGRESS_TOKEN: ${CORE_INGRESS_TOKEN:?Private gateway credential required}
  api-gw:
    volumes:
      - type: bind
        source: ${CORE_AUTH_INGRESS_TEMPLATE:?Generated official template with private ingress headers required}
        target: /etc/envoy/lds.template.yaml
        read_only: true
