# Overlay only: the complete official source remains under supabase/upstream/docker.
services:
  api-gw:
    ports: !reset []
  supavisor:
    ports: !reset []
    ulimits:
      nofile:
        soft: 100000
        hard: 100000
  auth:
    environment:
      GOTRUE_JWT_ISSUER: http://api-gw:8000/auth/v1
      GOTRUE_DISABLE_SIGNUP: 'true'
      GOTRUE_EXTERNAL_EMAIL_ENABLED: 'false'
      GOTRUE_EXTERNAL_PHONE_ENABLED: ${CORE_ADMIN_PASSWORD_AUTH_ENABLED:-false}
      GOTRUE_HOOK_SEND_SMS_ENABLED: 'true'
      GOTRUE_HOOK_SEND_SMS_URI: pg-functions://postgres/core/auth_send_sms_hook
      GOTRUE_SMS_AUTOCONFIRM: 'false'
      GOTRUE_SMS_OTP_EXP: ${AUTH_SMS_OTP_EXP:-3600}
  studio:
    environment:
      OPENAI_API_KEY: ''
  functions:
    command: [start, --main-service, /home/services/core-worker/src]
    environment:
      VERIFY_JWT: 'false'
      SUPABASE_SERVICE_ROLE_KEY: ''
      SUPABASE_DB_URL: postgresql://core_runtime:${CORE_DATABASE_PASSWORD}@db:5432/postgres
      CORE_JWT_ISSUER: http://api-gw:8000/auth/v1
      CORE_ENVIRONMENT: ${AGORAWEAVE_LOCAL_ENVIRONMENT:-${CI_ENVIRONMENT}}
      CORE_INGRESS_TOKEN: ${CORE_INGRESS_TOKEN:-}
      CORE_PHONE_AUTH_ENABLED: 'false'
      CORE_ADMIN_PASSWORD_AUTH_ENABLED: ${CORE_ADMIN_PASSWORD_AUTH_ENABLED:-false}
      CORE_ADMIN_PASSWORD_BFF_KEY: ${CORE_ADMIN_PASSWORD_BFF_KEY:-}
      CORE_DEV_TEST_LOGIN_ENABLED: ${CORE_DEV_TEST_LOGIN_ENABLED:-false}
      CORE_DEV_TEST_USERNAME: ${CORE_DEV_TEST_USERNAME:-}
      CORE_DEV_TEST_PHONE: ${CORE_DEV_TEST_PHONE:-}
      CORE_DEV_TEST_ACCOUNT_ID: ${CORE_DEV_TEST_ACCOUNT_ID:-}
      CORE_AUTH_SMS_OTP_EXP_SECONDS: ${AUTH_SMS_OTP_EXP:-3600}
      ALIYUN_SMS_ACCESS_KEY_ID: ${ALIYUN_SMS_ACCESS_KEY_ID:-}
      ALIYUN_SMS_ACCESS_KEY_SECRET: ${ALIYUN_SMS_ACCESS_KEY_SECRET:-}
      ALIYUN_SMS_SIGN_NAME: ${ALIYUN_SMS_SIGN_NAME:-}
      ALIYUN_SMS_TEMPLATE_CODE: ${ALIYUN_SMS_TEMPLATE_CODE:-}
      CORE_WORKER_DB_URL: postgresql://core_worker:${CORE_WORKER_DATABASE_PASSWORD}@db:5432/postgres
    volumes:
      - ${AGORAWEAVE_WORKSPACE:-${GITHUB_WORKSPACE}}/supabase/functions/core:/home/deno/functions/core:ro
      - ${AGORAWEAVE_WORKSPACE:-${GITHUB_WORKSPACE}}/services/core-worker/src:/home/services/core-worker/src:ro
      - ${AGORAWEAVE_WORKSPACE:-${GITHUB_WORKSPACE}}/packages:/home/packages:ro
      - core-security-journal:/var/lib/agoraweave-security
volumes:
  core-security-journal:
networks:
  default:
    internal: true
