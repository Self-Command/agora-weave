# Overlay only: the complete official source remains under supabase/upstream/docker.
services:
  api-gw:
    ports: !reset []
  supavisor:
    ports: !reset []
    ulimits:
      nofile:
        soft: 100000
        hard: 100000
  auth:
    environment:
      GOTRUE_DISABLE_SIGNUP: 'true'
      GOTRUE_EXTERNAL_EMAIL_ENABLED: 'false'
      GOTRUE_EXTERNAL_PHONE_ENABLED: 'false'
      GOTRUE_SMS_AUTOCONFIRM: 'false'
  studio:
    environment:
      OPENAI_API_KEY: ''
networks:
  default:
    internal: true
