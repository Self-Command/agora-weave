version: 1
scope: bootstrap-services
environments:
  dev:
    credentials_secret: CI_DEV_SUPABASE_ENV
    database: separate-github-hosted-runner
    storage: separate-checkout-and-docker-volumes
  test:
    credentials_secret: CI_TEST_SUPABASE_ENV
    database: separate-github-hosted-runner
    storage: separate-checkout-and-docker-volumes
network:
  driver: bridge
  internal: true
  published_ports: []
  external_services: []
  access: docker-exec-for-internal-health-and-ed17-authenticated-health-gateway
  temporary_https_gateway:
    decision: ED-17
    runner: github-hosted
    route: /auth/v1/health
    source: runner-host-http-to-isolated-auth-container-ip
    authorization: per-run-attempt-sha-and-environment
    other_routes: refused
    other_environment_credentials: refused
    provider: pinned-cloudflare-temporary-tunnel
    data: synthetic-non-production-only
    cleanup: tunnel-gateway-and-temporary-credentials-on-exit
side_effects:
  signup: disabled
  email: disabled
  phone: disabled
  production_credentials: forbidden
cleanup:
  always: true
  docker_compose_down_volumes: true
  runner_ephemeral: true
