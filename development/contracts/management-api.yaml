openapi: 3.0.3
info:
  title: AgoraWeave management browser BFF
  version: 1.0.0
  description: Current wire contracts and explicit future operations. x-implementation=planned
    is a development agreement, not evidence of a deployed backend. All examples are
    fictitious. Deployment endpoint is client configuration; the default server is
    a local mock.
servers:
- url: http://127.0.0.1:4011/api/management
  description: Local mock only; override for isolated dev/test provider.
paths:
  /auth/challenges:
    post:
      operationId: createManagementOtpChallenge
      summary: createManagementOtpChallenge
      description: 'Browser BFF: same-origin JSON + CSRF, encrypted HttpOnly cookie.
        Login rechecks current management grant before setting cookie. No access_token
        or refresh_token in browser JSON.'
      x-implementation: implemented
      x-verification: external-auth-test-only
      security: []
      parameters:
      - $ref: '#/components/parameters/Csrf'
      - $ref: '#/components/parameters/Origin'
      responses:
        '200':
          description: Success. Saving/acceptance does not imply publication or external
            delivery.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpChallengeEnvelope'
              examples:
                success:
                  summary: Fixed fictitious success
                  value:
                    request_id: 10000000-0000-4000-8000-000000000001
                    config_version: synthetic-config-v1
                    data:
                      challenge_id: 10000000-0000-4000-8000-000000000001
                      expires_at: '2026-10-18T00:00:00.000Z'
                      retry_after: 60
        '401':
          description: Invalid or revoked current session
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                failure:
                  value:
                    request_id: 10000000-0000-4000-8000-000000000001
                    code: SESSION_INVALID
                    message: 请求内容有误，请检查后重试
                    retryable: false
        '403':
          description: Current action or audience denied
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                failure:
                  value:
                    request_id: 10000000-0000-4000-8000-000000000001
                    code: FORBIDDEN
                    message: 请求内容有误，请检查后重试
                    retryable: false
        '409':
          description: Version or operation payload conflict; preserve input
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                failure:
                  value:
                    request_id: 10000000-0000-4000-8000-000000000001
                    code: CONFLICT
                    message: 请求内容有误，请检查后重试
                    retryable: false
        '422':
          description: Invalid input or unmet business requirement
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                failure:
                  value:
                    request_id: 10000000-0000-4000-8000-000000000001
                    code: INVALID_INPUT
                    message: 请求内容有误，请检查后重试
                    retryable: false
        '429':
          description: Rate limited
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                failure:
                  value:
                    request_id: 10000000-0000-4000-8000-000000000001
                    code: RATE_LIMITED
                    message: 请求内容有误，请检查后重试
                    retryable: true
        '503':
          description: Dependency unavailable or outcome unconfirmed; query original
            operation before retry
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                failure:
                  value:
                    request_id: 10000000-0000-4000-8000-000000000001
                    code: SERVICE_UNAVAILABLE
                    message: 请求内容有误，请检查后重试
                    retryable: true
      x-source: apps/admin/src/app/api/management/[...path]/route.ts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginChallengeRequest'
            examples:
              synthetic:
                summary: Fictitious input, never real credentials or consent
                value:
                  phone: '+15555550199'
                  purpose: login
                  operation_id: 10000000-0000-4000-8000-000000000001
      x-audiences:
      - management-browser
      x-max-request-bytes: 16384
      x-provider-test-default: false
