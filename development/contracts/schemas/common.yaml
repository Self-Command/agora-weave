components:
  schemas:
    Uuid:
      type: string
      format: uuid
      pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
    Timestamp:
      type: string
      format: date-time
    Digest:
      type: string
      pattern: ^[a-f0-9]{64}$
    ConfigVersion:
      type: string
      minLength: 1
      maxLength: 2048
    Error:
      type: object
      additionalProperties: false
      properties:
        request_id: &id001
          $ref: '#/components/schemas/Uuid'
        code:
          type: string
          pattern: ^[A-Z][A-Z0-9_]*$
          maxLength: 64
        message:
          type: string
          minLength: 1
          maxLength: 1024
        retryable: &id003
          type: boolean
        retry_after_seconds: &id005
          type: integer
          minimum: 0
        operation_id: *id001
        current_config_version: &id007
          $ref: '#/components/schemas/ConfigVersion'
        field_errors:
          type: object
          additionalProperties:
            type: string
            minLength: 1
            maxLength: 1024
          maxProperties: 50
      required:
      - request_id
      - code
      - message
      - retryable
    Empty:
      type: object
      additionalProperties: false
      properties: {}
    OperationCommand:
      type: object
      additionalProperties: false
      properties:
        operation_id: *id001
      required:
      - operation_id
    VersionedCommand:
      type: object
      additionalProperties: false
      properties:
        operation_id: *id001
        base_version: &id002
          type: integer
          minimum: 1
      required:
      - operation_id
      - base_version
    SessionTokens:
      type: object
      additionalProperties: false
      properties:
        access_token:
          type: string
          minLength: 12
          maxLength: 8192
          description: Sensitive. All checked-in examples are deliberately fictitious.
        refresh_token:
          type: string
          minLength: 12
          maxLength: 4096
        expires_at: *id002
      required:
      - access_token
      - refresh_token
      - expires_at
      description: 'Official OTP/MFA adapter output accepts refresh token up to 4096.
        Current refresh input and browser cookie session validator accept at most
        2048: this existing compatibility boundary is not backend completion.'
    AgeDeclaration:
      type: object
      additionalProperties: false
      properties:
        version:
          type: string
          minLength: 1
          maxLength: 128
        declared: *id003
      description: Wire parser accepts boolean; successful registration requires declared=true
        and current version.
      required:
      - version
      - declared
    Consent:
      type: object
      additionalProperties: false
      properties:
        release_id: *id001
        digest: &id004
          $ref: '#/components/schemas/Digest'
        decision:
          type: string
          enum:
          - consented
          - presented
          - acknowledged
      description: Wire parser accepts these decisions; registration admission requires
        each applicable item to be consented.
      required:
      - release_id
      - digest
      - decision
    LoginChallengeRequest:
      type: object
      additionalProperties: false
      properties:
        phone:
          type: string
          pattern: ^\+[1-9][0-9]{7,14}$
        purpose:
          type: string
          enum:
          - login
        operation_id: *id001
      required:
      - phone
      - purpose
      - operation_id
    RegistrationChallengeRequest:
      type: object
      additionalProperties: false
      properties:
        phone:
          type: string
          pattern: ^\+[1-9][0-9]{7,14}$
        purpose:
          type: string
          enum:
          - register
        operation_id: *id001
        invitation_ref:
          type: string
          minLength: 1
          maxLength: 256
        age_declaration:
          $ref: '#/components/schemas/AgeDeclaration'
        document_set_digest: *id004
      required:
      - phone
      - purpose
      - operation_id
      - invitation_ref
      - age_declaration
      - document_set_digest
    OtpChallengeRequest:
      oneOf:
      - $ref: '#/components/schemas/LoginChallengeRequest'
      - $ref: '#/components/schemas/RegistrationChallengeRequest'
    OtpVerificationRequest:
      type: object
      additionalProperties: false
      properties:
        challenge_id: *id001
        otp:
          type: string
          pattern: ^[0-9]{6}$
        operation_id: *id001
      required:
      - challenge_id
      - otp
      - operation_id
    RegistrationVerificationRequest:
      type: object
      additionalProperties: false
      properties:
        challenge_id: *id001
        otp:
          type: string
          pattern: ^[0-9]{6}$
        operation_id: *id001
        age_declaration:
          $ref: '#/components/schemas/AgeDeclaration'
        document_set_digest: *id004
        consents:
          type: array
          items:
            $ref: '#/components/schemas/Consent'
      required:
      - challenge_id
      - otp
      - operation_id
      - age_declaration
      - document_set_digest
      - consents
    VerifyRequest:
      oneOf:
      - $ref: '#/components/schemas/OtpVerificationRequest'
      - $ref: '#/components/schemas/RegistrationVerificationRequest'
    OtpChallenge:
      type: object
      additionalProperties: false
      properties:
        challenge_id: *id001
        expires_at: &id006
          $ref: '#/components/schemas/Timestamp'
        retry_after: *id005
      required:
      - challenge_id
      - expires_at
      - retry_after
    AuthReceipt:
      type: object
      additionalProperties: false
      properties:
        session:
          $ref: '#/components/schemas/SessionTokens'
        account:
          type: object
          additionalProperties: false
          properties:
            id: *id001
            admitted: *id003
          required:
          - id
          - admitted
      required:
      - session
      - account
    PendingAuthOperation:
      type: object
      additionalProperties: false
      properties:
        operation_id: *id001
        state:
          type: string
          enum:
          - pending
          - unknown
      required:
      - operation_id
      - state
    AuthOperation:
      oneOf:
      - $ref: '#/components/schemas/AuthReceipt'
      - $ref: '#/components/schemas/PendingAuthOperation'
    RefreshRequest:
      type: object
      additionalProperties: false
      properties:
        refresh_token:
          type: string
          minLength: 12
          maxLength: 2048
          pattern: ^[^\x00-\x20\x7f]+$
      required:
      - refresh_token
    RefreshedSession:
      type: object
      additionalProperties: false
      properties:
        session:
          $ref: '#/components/schemas/SessionTokens'
      required:
      - session
    RevocationReceipt:
      type: object
      additionalProperties: false
      properties:
        revoked: *id003
        clear_restricted_cache: *id003
      required:
      - revoked
      - clear_restricted_cache
    DeviceSession:
      type: object
      additionalProperties: false
      properties:
        id: *id001
        device_label:
          type: string
        current: *id003
        row_version: *id002
        created_at: *id006
        trusted_at:
          type: string
          format: date-time
          nullable: true
      required:
      - id
      - device_label
      - current
      - row_version
      - created_at
      - trusted_at
    SessionPage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DeviceSession'
          maxItems: 50
        next_cursor:
          type: string
          minLength: 1
          maxLength: 2048
          nullable: true
        has_more: *id003
      required:
      - items
      - next_cursor
      - has_more
    RecoveryRequest:
      type: object
      additionalProperties: false
      properties:
        mode:
          type: string
          enum:
          - trusted
          - manual
        operation_id: *id001
      required:
      - mode
      - operation_id
    RecoveryCase:
      type: object
      additionalProperties: false
      properties:
        id: *id001
        mode:
          type: string
          enum:
          - trusted
          - manual
          - mfa_emergency
        state:
          type: string
          enum:
          - received
          - reviewing
          - approved
          - rejected
          - need_evidence
        created_at: *id006
        updated_at: *id006
        row_version: *id002
      required:
      - id
      - mode
      - state
      - created_at
      - updated_at
      - row_version
    AccountOperation:
      type: object
      additionalProperties: false
      properties:
        operation_id: *id001
        action:
          type: string
          enum:
          - auth.register
          - session.revoke
          - auth.logout
          - recovery.request
          - config.release
          - config.rollback
          - post.create
          - comment.create
          - like.put
          - like.remove
          - block.put
          - block.remove
          - profile.update
          - report.create
          - appeal.create
          - moderation.revisions.decide
          - upload.create
          - upload.part
          - upload.complete
        state:
          type: string
          enum:
          - pending
          - succeeded
          - failed
          - unknown
        result:
          oneOf:
          - $ref: '#/components/schemas/ConfigRelease'
          - $ref: '#/components/schemas/RevisionReceipt'
          - $ref: '#/components/schemas/ReactionReceipt'
          - $ref: '#/components/schemas/ActionReceipt'
          - $ref: '#/components/schemas/Profile'
          - $ref: '#/components/schemas/Report'
          - $ref: '#/components/schemas/Appeal'
          - $ref: '#/components/schemas/UploadSession'
          - $ref: '#/components/schemas/UploadedPart'
      required:
      - operation_id
      - action
      - state
    RegistrationDocument:
      type: object
      additionalProperties: false
      properties:
        release_id: *id001
        document_id: *id001
        title:
          type: string
        body:
          type: string
        digest: *id004
        kind:
          type: string
          enum:
          - terms
          - privacy
      required:
      - release_id
      - document_id
      - title
      - body
      - digest
      - kind
    RegistrationDocuments:
      type: object
      additionalProperties: false
      properties:
        documents:
          type: array
          items:
            $ref: '#/components/schemas/RegistrationDocument'
        document_set_digest: *id004
        age_declaration_version:
          type: string
      required:
      - documents
      - document_set_digest
      - age_declaration_version
    DocumentScope:
      type: object
      additionalProperties: false
      properties:
        environment:
          type: string
          enum:
          - dev
          - test
          - production
        surfaces:
          type: array
          items:
            type: string
            enum:
            - app
            - share
            - admin
        purposes:
          type: array
          items:
            type: string
          nullable: true
      required:
      - environment
      - surfaces
    PublishedDocument:
      type: object
      additionalProperties: false
      properties:
        document_id: *id001
        release_id: *id001
        stable_key:
          type: string
        kind:
          type: string
          enum:
          - community_rules
          - privacy
          - terms
          - processing_notice
          - help
        locale:
          type: string
        title:
          type: string
        body:
          type: string
        digest: *id004
        state:
          type: string
          enum:
          - published
          - superseded
        published_at: *id006
        is_current: *id003
        scope:
          $ref: '#/components/schemas/DocumentScope'
      required:
      - document_id
      - release_id
      - stable_key
      - kind
      - locale
      - title
      - body
      - digest
      - state
      - published_at
      - is_current
      - scope
    PublishedDocumentSet:
      type: object
      additionalProperties: false
      properties:
        documents:
          type: array
          items:
            $ref: '#/components/schemas/PublishedDocument'
          maxItems: 50
        document_set_digest: *id004
      required:
      - documents
      - document_set_digest
    CurrentDocuments:
      oneOf:
      - $ref: '#/components/schemas/RegistrationDocuments'
      - $ref: '#/components/schemas/PublishedDocumentSet'
    ReadPost:
      type: object
      additionalProperties: false
      properties:
        id: *id001
        author_id: *id001
        visibility:
          type: string
          enum:
          - public
          - followers
          - self
        revision_id: *id001
        type:
          type: string
          enum:
          - text
          - images
        media_refs:
          type: array
          items: *id001
          maxItems: 9
        body:
          type: string
        row_version: *id002
      description: Actual current read projection. Full post composition is planned
        separately.
      required:
      - id
      - author_id
      - visibility
      - revision_id
      - type
      - media_refs
      - body
      - row_version
    LatestPost:
      type: object
      additionalProperties: false
      properties:
        id: *id001
        author_id: *id001
        visibility:
          type: string
          enum:
          - public
        revision_id: *id001
        type:
          type: string
          enum:
          - text
          - images
        media_refs:
          type: array
          items: *id001
          maxItems: 9
        body:
          type: string
        row_version: *id002
        created_at:
          type: string
          format: date-time
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\.[0-9]{6}Z$
      required:
      - id
      - author_id
      - visibility
      - revision_id
      - type
      - media_refs
      - body
      - row_version
      - created_at
    LatestPage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/LatestPost'
          maxItems: 50
        next_cursor:
          type: string
          minLength: 1
          maxLength: 2048
          nullable: true
        has_more: *id003
      required:
      - items
      - next_cursor
      - has_more
    JsonValue:
      description: JSON value for registered configuration schemas only; this does
        not replace domain DTOs.
      oneOf:
      - type: string
        nullable: true
      - type: number
      - *id003
      - type: array
        items:
          $ref: '#/components/schemas/JsonValue'
      - type: object
        additionalProperties:
          $ref: '#/components/schemas/JsonValue'
    EffectiveConfiguration:
      type: object
      additionalProperties: false
      properties:
        version: *id007
        values:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/JsonValue'
      required:
      - version
      - values
    RecipientEvent:
      type: object
      additionalProperties: false
      properties:
        event_id: *id001
        type:
          type: string
        scope:
          type: string
          enum:
          - account
        sequence: *id002
      required:
      - event_id
      - type
      - scope
      - sequence
    ResourceEvent:
      type: object
      additionalProperties: false
      properties:
        event_id: *id001
        type:
          type: string
        target_ref: *id001
        aggregate_version: *id002
        sequence: *id002
      required:
      - event_id
      - type
      - target_ref
      - aggregate_version
      - sequence
    ProjectedEvent:
      oneOf:
      - $ref: '#/components/schemas/RecipientEvent'
      - $ref: '#/components/schemas/ResourceEvent'
    EventPage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProjectedEvent'
          maxItems: 50
        cursor: *id005
      required:
      - items
      - cursor
    Administrator:
      type: object
      additionalProperties: false
      properties:
        account:
          type: object
          additionalProperties: false
          properties:
            id: *id001
            phone_masked:
              type: string
          required:
          - id
          - phone_masked
        environment:
          type: string
          enum:
          - dev
          - test
          - production
        roles:
          type: array
          items:
            type: string
        permissions:
          type: array
          items:
            type: string
        mfa:
          type: object
          additionalProperties: false
          properties:
            aal:
              type: string
              enum:
              - aal1
              - aal2
            enrolled: *id003
            verified: *id003
          required:
          - aal
          - enrolled
          - verified
        sensitive_until:
          type: string
          format: date-time
          nullable: true
      required:
      - account
      - environment
      - roles
      - permissions
      - mfa
      - sensitive_until
    BrowserAdministrator:
      type: object
      additionalProperties: false
      properties:
        administrator:
          $ref: '#/components/schemas/Administrator'
      required:
      - administrator
    CoreMfaVerification:
      type: object
      additionalProperties: false
      properties:
        session:
          $ref: '#/components/schemas/SessionTokens'
        administrator:
          $ref: '#/components/schemas/Administrator'
      required:
      - session
      - administrator
    MfaFactor:
      type: object
      additionalProperties: false
      properties:
        id: *id001
        factor_type:
          type: string
          enum:
          - totp
        friendly_name:
          type: string
          nullable: true
        status:
          type: string
          enum:
          - verified
          - unverified
        created_at: *id006
      required:
      - id
      - factor_type
      - friendly_name
      - status
      - created_at
    MfaFactors:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MfaFactor'
      required:
      - items
    MfaEnrollmentRequest:
      type: object
      additionalProperties: false
      properties:
        friendly_name:
          type: string
          minLength: 1
          maxLength: 80
      required:
      - friendly_name
    BrowserMfaEnrollmentRequest:
      type: object
      additionalProperties: false
      properties:
        friendly_name:
          type: string
          minLength: 1
          maxLength: 64
      required:
      - friendly_name
    MfaEnrollment:
      type: object
      additionalProperties: false
      properties:
        id: *id001
        type:
          type: string
          enum:
          - totp
        totp:
          type: object
          additionalProperties: false
          properties:
            qr_code:
              type: string
            secret:
              type: string
              pattern: ^[A-Z2-7]{32,128}$
            uri:
              type: string
          required:
          - qr_code
          - secret
          - uri
      required:
      - id
      - type
      - totp
    MfaChallengeRequest:
      type: object
      additionalProperties: false
      properties:
        factor_id: *id001
      required:
      - factor_id
    MfaChallenge:
      type: object
      additionalProperties: false
      properties:
        id: *id001
        type:
          type: string
          enum:
          - totp
        expires_at: *id002
      required:
      - id
      - type
      - expires_at
    MfaVerifyRequest:
      type: object
      additionalProperties: false
      properties:
        factor_id: *id001
        challenge_id: *id001
        code:
          type: string
          pattern: ^[0-9]{6}$
      required:
      - factor_id
      - challenge_id
      - code
    StepupRequest:
      type: object
      additionalProperties: false
      properties:
        factor_id: *id001
        challenge_id: *id001
        code:
          type: string
          pattern: ^[0-9]{6}$
        action_digest: *id004
      required:
      - factor_id
      - challenge_id
      - code
      - action_digest
    BrowserStepupReceipt:
      type: object
      additionalProperties: false
      properties:
        stepup_id: *id001
        expires_at: *id006
      required:
      - stepup_id
      - expires_at
    CoreStepupReceipt:
      type: object
      additionalProperties: false
      properties:
        stepup_id: *id001
        expires_at: *id006
        session:
          $ref: '#/components/schemas/SessionTokens'
      required:
      - stepup_id
      - expires_at
      - session
    ManagedAccount:
      type: object
      additionalProperties: false
      properties:
        id: *id001
        status:
          type: string
          enum:
          - active
          - cancelled
        phone_masked:
          type: string
        registered_at: *id006
        roles:
          type: array
          items:
            type: string
      required:
      - id
      - status
      - phone_masked
      - registered_at
      - roles
    ManagedAccountPage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ManagedAccount'
          maxItems: 50
        next_cursor:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
          nullable: true
        has_more: *id003
      required:
      - items
      - next_cursor
      - has_more
    OtpKey:
      type: string
      enum:
      - auth.otp_lifetime_seconds
      - auth.otp_resend_seconds
      - auth.otp_max_failures
      - auth.otp_phone_hourly
      - auth.otp_phone_daily
      - auth.otp_ip_hourly
    OtpValues:
      type: object
      additionalProperties: false
      properties:
        auth.otp_lifetime_seconds: *id002
        auth.otp_resend_seconds: *id002
        auth.otp_max_failures: *id002
        auth.otp_phone_hourly: *id002
        auth.otp_phone_daily: *id002
        auth.otp_ip_hourly: *id002
      required:
      - auth.otp_lifetime_seconds
      - auth.otp_resend_seconds
      - auth.otp_max_failures
      - auth.otp_phone_hourly
      - auth.otp_phone_daily
      - auth.otp_ip_hourly
    OtpDefinition:
      type: object
      additionalProperties: false
      properties:
        key:
          $ref: '#/components/schemas/OtpKey'
        description:
          type: string
        default_value:
          type: integer
        value:
          type: integer
        range:
          type: object
          additionalProperties: false
          properties:
            type:
              type: string
              enum:
              - integer
            minimum:
              type: integer
            maximum:
              type: integer
        read_permission:
          type: string
        write_permission:
          type: string
        effect_mode:
          type: string
        existing_policy:
          type: string
      required:
      - key
      - description
      - default_value
      - value
      - range
      - read_permission
      - write_permission
      - effect_mode
      - existing_policy
    OtpConfiguration:
      type: object
      additionalProperties: false
      properties:
        base_version: *id007
        environment:
          type: string
          enum:
          - dev
          - test
          - production
        definitions:
          type: array
          items:
            $ref: '#/components/schemas/OtpDefinition'
        deployment_max_lifetime_seconds: *id002
        history:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              version: *id007
              effective_at: *id006
              reason:
                type: string
              kind:
                type: string
                enum:
                - release
                - rollback
                - baseline
            required:
            - version
            - effective_at
            - reason
            - kind
      required:
      - base_version
      - environment
      - definitions
      - deployment_max_lifetime_seconds
      - history
    ConfigValuesPreviewRequest:
      type: object
      additionalProperties: false
      properties:
        base_version: *id007
        values:
          $ref: '#/components/schemas/OtpValues'
        reason:
          type: string
          minLength: 1
          maxLength: 1000
        operation_id: *id001
      required:
      - base_version
      - values
      - reason
      - operation_id
    ConfigRollbackPreviewRequest:
      type: object
      additionalProperties: false
      properties:
        base_version: *id007
        rollback_version: *id007
        reason:
          type: string
          minLength: 1
          maxLength: 1000
        operation_id: *id001
      required:
      - base_version
      - rollback_version
      - reason
      - operation_id
    ConfigPreviewRequest:
      oneOf:
      - $ref: '#/components/schemas/ConfigValuesPreviewRequest'
      - $ref: '#/components/schemas/ConfigRollbackPreviewRequest'
    ConfigPreview:
      type: object
      additionalProperties: false
