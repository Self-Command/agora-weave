parameters:
  ClientRelease:
    in: header
    name: X-Client-Release
    required: true
    schema:
      type: string
      pattern: ^[A-Za-z0-9_.-]{1,128}$
    example: fixture-v1
  ConfigVersion:
    in: header
    name: X-Config-Version
    required: false
    schema: *id007
    description: Display snapshot only; never freezes current authorization.
  Csrf:
    in: header
    name: X-AgoraWeave-CSRF
    required: true
    schema:
      type: string
      enum:
      - '1'
    example: '1'
  Origin:
    in: header
    name: Origin
    required: true
    schema:
      type: string
      format: uri
    example: http://127.0.0.1:4011
    description: Must equal actual BFF origin; forged forwarded headers do not establish
      origin.
  Limit:
    in: query
    name: limit
    schema:
      type: integer
      minimum: 1
      maximum: 50
      default: 20
  Cursor:
    in: query
    name: cursor
    schema:
      type: string
      minLength: 1
      maxLength: 2048
      pattern: ^[A-Za-z0-9_-]+$
headers:
  CacheControl:
    description: Current authorization responses cannot be cached.
    schema:
      type: string
      enum:
      - no-store
    example: no-store
  SetCookie:
    description: Encrypted HttpOnly SameSite=Strict session; Secure and __Host-agora-admin
      in production, agora-admin in local dev/test. Never copy tokens to JSON.
    schema:
      type: string
  ContentRange:
    schema:
      type: string
    description: Single byte range or bytes */size on 416.
  ETag:
    schema:
      type: string
    description: Quoted content hash; conditional requests still recheck authorization.
