    get:
      operationId: getSessionCoreAdmin
      summary: getSessionCoreAdmin
      description: Recheck current management grant. aal1 only session/MFA onboarding,
        permissions empty. Business access requires signed aal2, current official
        TOTP factor/session and environment grant. Config preview binds all six OTP
        values or rollback version; commit consumes single-use exact stepup. Production
        publication refused without concrete confirmation.
      x-implementation: implemented
      x-verification: read-only
      security:
      - bearerAuth: []
      parameters: []
      responses:
        '200':
          description: Success. Saving/acceptance does not imply publication or external
            delivery.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdministratorEnvelope'
              examples:
                success:
                  summary: Fixed fictitious success
                  value:
                    request_id: 10000000-0000-4000-8000-000000000001
                    config_version: synthetic-config-v1
                    data: &id001
                      account:
                        id: 10000000-0000-4000-8000-000000000001
                        phone_masked: +1555****0199
                      environment: test
                      roles:
                      - super_admin
                      permissions:
                      - admin.accounts.read
                      - config.read
                      mfa:
                        aal: aal2
                        enrolled: true
                        verified: true
                      sensitive_until: null
        '401':
          description: Invalid or revoked current session
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                failure:
                  value:
                    request_id: 10000000-0000-4000-8000-000000000001
                    code: SESSION_INVALID
                    message: 请求内容有误，请检查后重试
                    retryable: false
        '403':
          description: Current action or audience denied
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                failure:
                  value:
                    request_id: 10000000-0000-4000-8000-000000000001
                    code: FORBIDDEN
                    message: 请求内容有误，请检查后重试
                    retryable: false
        '422':
          description: Invalid input or unmet business requirement
          headers:
            Cache-Control:
