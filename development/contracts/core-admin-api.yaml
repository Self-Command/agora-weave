    OtpDefinitionRange:
      $ref: ./schemas/common.yaml#/components/schemas/OtpDefinitionRange
  parameters:
    ClientRelease:
      $ref: ./schemas/common.yaml#/parameters/ClientRelease
    ConfigVersion:
      $ref: ./schemas/common.yaml#/parameters/ConfigVersion
    Csrf:
