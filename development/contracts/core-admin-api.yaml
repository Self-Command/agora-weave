  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Official Auth access JWT plus current core session/account/grant
        checks. Signed aal2 and current TOTP evidence required for management business
        access.
    signedBff:
      type: apiKey
      in: header
      name: X-Admin-Password-Signature
      description: Server-only HMAC plus X-Admin-Password-Time and X-Admin-Password-Nonce,
        trusted gateway ingress and environment binding. Never provision signing secret
        to browser.
