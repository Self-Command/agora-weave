openapi: 3.0.3
info:
  title: AgoraWeave management core server API
  version: 1.0.0
  description: Current wire contracts and explicit future operations. x-implementation=planned
    is a development agreement, not evidence of a deployed backend. All examples are
    fictitious. Deployment endpoint is client configuration; the default server is
    a local mock.
servers:
- url: http://127.0.0.1:4012
  description: Local mock only; override for isolated dev/test provider.
paths:
