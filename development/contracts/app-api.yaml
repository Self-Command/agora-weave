openapi: 3.0.3
info:
  title: AgoraWeave App API
  version: 1.0.0
  description: Current wire contracts and explicit future operations. x-implementation=planned
    is a development agreement, not evidence of a deployed backend. All examples are
    fictitious. Deployment endpoint is client configuration; the default server is
    a local mock.
servers:
- url: http://127.0.0.1:4010
  description: Local mock only; override for isolated dev/test provider.
paths:
  /auth/challenges:
    post:
      operationId: createOtpChallenge
      summary: createOtpChallenge
      description: E.164 + login/register only; registration needs invitation, age
        declaration and current document set. Accepted SMS required for success. Same
        operation never sends twice. No OTP in response.
      x-implementation: implemented
      x-verification: external-sms-test-only
      security: []
      parameters: []
      responses:
        '200':
          description: Success. Saving/acceptance does not imply publication or external
            delivery.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpChallengeEnvelope'
              examples:
                success:
                  summary: Fixed fictitious success
                  value:
                    request_id: 10000000-0000-4000-8000-000000000001
                    config_version: synthetic-config-v1
                    data:
                      challenge_id: 10000000-0000-4000-8000-000000000001
                      expires_at: '2026-10-18T00:00:00.000Z'
                      retry_after: 60
        '401':
          description: Invalid or revoked current session
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                failure:
                  value:
                    request_id: 10000000-0000-4000-8000-000000000001
                    code: SESSION_INVALID
                    message: 请求内容有误，请检查后重试
                    retryable: false
        '403':
          description: Current action or audience denied
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                failure:
                  value:
                    request_id: 10000000-0000-4000-8000-000000000001
                    code: FORBIDDEN
                    message: 请求内容有误，请检查后重试
                    retryable: false
        '409':
          description: Version or operation payload conflict; preserve input
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                failure:
                  value:
                    request_id: 10000000-0000-4000-8000-000000000001
                    code: CONFLICT
                    message: 请求内容有误，请检查后重试
                    retryable: false
        '422':
          description: Invalid input or unmet business requirement
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                failure:
                  value:
                    request_id: 10000000-0000-4000-8000-000000000001
                    code: INVALID_INPUT
                    message: 请求内容有误，请检查后重试
                    retryable: false
        '429':
          description: Rate limited
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                failure:
                  value:
                    request_id: 10000000-0000-4000-8000-000000000001
                    code: RATE_LIMITED
                    message: 请求内容有误，请检查后重试
                    retryable: true
        '503':
          description: Dependency unavailable or outcome unconfirmed; query original
            operation before retry
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                failure:
                  value:
                    request_id: 10000000-0000-4000-8000-000000000001
                    code: SERVICE_UNAVAILABLE
                    message: 请求内容有误，请检查后重试
                    retryable: true
        '405':
          description: Unsupported method rejected; no successful business side effect.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                failure:
                  value:
                    request_id: 10000000-0000-4000-8000-000000000001
                    code: METHOD_NOT_ALLOWED
                    message: 请求内容有误，请检查后重试
                    retryable: false
      x-source: supabase/functions/core/routes/public-auth.ts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpChallengeRequest'
            examples:
              synthetic:
                summary: Fictitious input, never real credentials or consent
                value:
                  phone: '+15555550199'
                  purpose: login
                  operation_id: 10000000-0000-4000-8000-000000000001
              registration:
                value:
                  phone: '+15555550199'
                  purpose: register
                  operation_id: 10000000-0000-4000-8000-000000000001
                  invitation_ref: FICTITIOUS_INVITATION
                  age_declaration:
                    version: adult-18-v1
                    declared: true
                  document_set_digest: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      x-audiences:
      - app
      x-max-request-bytes: 16384
      x-provider-test-default: false
  /auth/dev-test-login:
    post:
      operationId: devTestLogin
      summary: Development test account login
      description: >-
        Enabled only for the single provisioned ordinary test account in the local
        dev environment. Uses official Auth password verification and binds a real
        admitted session. This route is unavailable in test and production.
      x-implementation: implemented
      x-verification: local-dev-only
      x-source: supabase/functions/core/routes/dev-test-login.ts
      x-audiences:
      - app
      x-max-request-bytes: 2048
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [username, password]
              properties:
                username:
                  type: string
                  pattern: '^[a-z0-9][a-z0-9_.-]{2,63}$'
                password:
                  type: string
                  format: password
                  minLength: 14
                  maxLength: 72
            example:
              username: synthetic-dev-user
              password: FICTITIOUS_PASSWORD_FOR_SCHEMA_ONLY
      responses:
        '200':
          description: Real admitted development session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthReceiptEnvelope'
        '401':
          description: Invalid credentials or ineligible account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Official Auth rate limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Development login disabled or outcome unconfirmed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: Unsupported method
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
