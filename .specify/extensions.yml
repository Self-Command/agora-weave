installed:
- speckit-superpowers-bridge
- agoraweave-ci
settings:
  auto_execute_hooks: true
hooks:
  before_clarify:
  - extension: speckit-superpowers-bridge
    command: speckit.speckit-superpowers-bridge.guard
    enabled: true
    optional: false
    priority: 10
    prompt: Execute speckit.speckit-superpowers-bridge.guard?
    description: Prevent Spec Kit contract changes while Superpowers implementation
      is executing
    condition: null
  before_plan:
  - extension: speckit-superpowers-bridge
    command: speckit.speckit-superpowers-bridge.guard
    enabled: true
    optional: false
    priority: 10
    prompt: Execute speckit.speckit-superpowers-bridge.guard?
    description: Prevent Spec Kit contract changes while Superpowers implementation
      is executing
    condition: null
  before_tasks:
  - extension: speckit-superpowers-bridge
    command: speckit.speckit-superpowers-bridge.guard
    enabled: true
    optional: false
    priority: 10
    prompt: Execute speckit.speckit-superpowers-bridge.guard?
    description: Prevent Spec Kit contract changes while Superpowers implementation
      is executing
    condition: null
  before_implement:
  - extension: agoraweave-ci
    command: agoraweave.ci.start
    enabled: true
    optional: false
    priority: 5
    description: Authenticate the exact cloud bootstrap or business start admission
    condition: null
  - extension: speckit-superpowers-bridge
    command: speckit.speckit-superpowers-bridge.guard
    enabled: true
    optional: false
    priority: 10
    prompt: Execute speckit.speckit-superpowers-bridge.guard?
    description: Block speckit.implement for features handed off to Superpowers
    condition: null
  after_implement:
  - extension: agoraweave-ci
    command: agoraweave.ci.complete
    enabled: true
    optional: false
    priority: 5
    description: Authenticate full-release evidence before effective feature completion
    condition: null
  after_tasks:
  - extension: speckit-superpowers-bridge
    command: speckit.speckit-superpowers-bridge.handoff
    enabled: true
    optional: false
    priority: 10
    prompt: Execute speckit.speckit-superpowers-bridge.handoff?
    description: Create the Superpowers handoff after Spec Kit task generation
    condition: null
