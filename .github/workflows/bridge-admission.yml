name: Cloud bootstrap bridge admission
on:
  workflow_call:
    inputs:
      mode:
        type: string
        default: bootstrap-only
      transition:
        type: string
        default: start
      initialization_run_id:
        type: string
        default: ''
      completion_run_id:
        type: string
        default: ''
      development_run_id:
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [bootstrap-only, business-increment, full-release]
        default: bootstrap-only
      transition:
        type: choice
        options: [start, complete]
        default: start
      initialization_run_id:
        type: string
        default: ''
      completion_run_id:
        type: string
        default: ''
      development_run_id:
        type: string
        default: ''
permissions:
  contents: read
  actions: read
jobs:
  scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.23.3
          cache: npm
          cache-dependency-path: |
            package-lock.json
            infra/ci/toolchain-lock.json
      - name: Install frozen result-schema validator
        run: npm run ci:install
      - name: Execute actual native ownership pre-hook
        id: ownership
        shell: pwsh
        run: |
          & ./.specify/extensions/speckit-superpowers-bridge/scripts/powershell/guard-command.ps1 -Action 'superpowers:executing-plans' -Actor codex
          if (-not $?) { throw 'Native ownership guard failed' }
          git restore -- .specify/bridge-events.jsonl
      - name: Assess committed bootstrap scope and frozen contract bindings
        env:
          ACTUAL_PRE_HOOK: ${{ steps.ownership.outcome }}
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
          BRIDGE_MODE: ${{ inputs.mode || 'bootstrap-only' }}
          BRIDGE_TRANSITION: ${{ inputs.transition || 'start' }}
          INITIALIZATION_RUN_ID: ${{ inputs.initialization_run_id }}
          COMPLETION_RUN_ID: ${{ inputs.completion_run_id }}
          DEVELOPMENT_RUN_ID: ${{ inputs.development_run_id }}
          EVIDENCE_SSH_PRIVATE_KEY: ${{ secrets.EVIDENCE_SSH_PRIVATE_KEY }}
          EVIDENCE_SSH_HOST: ${{ secrets.EVIDENCE_SSH_HOST }}
          EVIDENCE_SSH_USER: ${{ secrets.EVIDENCE_SSH_USER }}
          EVIDENCE_SSH_KNOWN_HOSTS: ${{ secrets.EVIDENCE_SSH_KNOWN_HOSTS }}
        run: node --experimental-strip-types tools/ci/bridge-gate.ts
      - if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: bridge-admission-${{ github.run_id }}-${{ github.run_attempt }}
          path: bridge-output/bridge-admission.json
          if-no-files-found: error
          retention-days: 7
