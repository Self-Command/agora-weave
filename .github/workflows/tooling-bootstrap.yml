name: Installed bridge tooling probe
on:
  workflow_call:
permissions:
  contents: read
jobs:
  compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          submodules: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.23.3
          cache: npm
          cache-dependency-path: |
            package-lock.json
            infra/ci/toolchain-lock.json
      - name: Derive exact canonical task mapping and probe installed native commands
        shell: bash
        run: |
          set -eu
          mkdir -p tooling-output
          adapter="$RUNNER_TEMP/agoraweave-tooling-probe.md"
          trap 'rm -f "$adapter"' EXIT
          export PROBE_ADAPTER="$adapter"
          node --experimental-strip-types --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          import { createHash } from 'node:crypto';
          import { deriveTaskAdapter } from './tools/ci/task-adapter.ts';
          const options = JSON.parse(readFileSync('.specify/init-options.json', 'utf8'));
          if (options.speckit_version !== '1.0.12') throw new Error('Unverified Spec Kit version');
          const tasks = readFileSync('specs/001-agoraweave-v1/tasks.md', 'utf8');
          const derived = deriveTaskAdapter(tasks);
          if (derived.state !== 'mapped') throw new Error('No valid pending task mapping');
          writeFileSync(process.env.PROBE_ADAPTER, derived.adapter);
          const submodule = execFileSync('git', ['-C', 'superpowers-v7', 'rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          if (submodule !== 'bb92a77741419a4ab5f06e711a283343f1ada0c3') throw new Error('Installed SP gitlink drift');
          writeFileSync('tooling-output/mapping.json', JSON.stringify({ source: 'github-actions',
            checkout_sha: execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim(),
            run_id: process.env.GITHUB_RUN_ID, attempt: Number(process.env.GITHUB_RUN_ATTEMPT),
            runner_environment: process.env.RUNNER_ENVIRONMENT,
            check_set_digest: createHash('sha256').update(readFileSync('tools/ci/validation-manifest.json')).digest('hex'),
            toolchain_digest: createHash('sha256').update(readFileSync('infra/ci/toolchain-lock.json')).digest('hex'),
            spec_kit: options.speckit_version, superpowers: '7.0.0', superpowers_commit: submodule,
            tasks_sha256: createHash('sha256').update(tasks).digest('hex'), mapping: derived.mapping,
            expected_completion: 'refused', readiness: 'not_evaluated' }, null, 2) + '\n');
          NODE
          scripts="$GITHUB_WORKSPACE/superpowers-v7/skills/executing-plans/scripts"
          for n in $(seq 1 "$(node -e 'process.stdout.write(String(JSON.parse(require("fs").readFileSync("tooling-output/mapping.json")).mapping.length))')"); do
            bash "$scripts/task-start" "$adapter" "$n" >> tooling-output/task-extraction.log
          done
          workspace=$(bash superpowers-v7/skills/subagent-driven-development/scripts/sdd-workspace "$adapter")
          cp "$workspace/task-1-brief.md" tooling-output/first-brief.md
          last=$(node -e 'const rows=JSON.parse(require("fs").readFileSync("tooling-output/mapping.json")).mapping; process.stdout.write(String(rows.at(-1).task))')
          cp "$workspace/task-$last-brief.md" tooling-output/last-brief.md
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const rows = JSON.parse(readFileSync('tooling-output/mapping.json', 'utf8')).mapping;
          if (!readFileSync('tooling-output/first-brief.md', 'utf8').includes(rows[0].id) ||
              !readFileSync('tooling-output/last-brief.md', 'utf8').includes(rows.at(-1).id)) throw new Error('Native task brief mapping differs');
          NODE
          grep -q 'Expected:' tooling-output/first-brief.md
          grep -q 'Interface checks:' tooling-output/first-brief.md
          grep -q 'Overall regression:' tooling-output/first-brief.md
          base=$(git rev-parse HEAD)
          bash "$scripts/task-done" "$adapter" 1 "$base" -- bash -c 'printf "Synthetic cloud exit zero; no canonical completion\n"' > tooling-output/raw-task-done.log
          cp "$workspace/progress.md" tooling-output/raw-native-ledger.md
          grep -q 'Task 1: complete' tooling-output/raw-native-ledger.md
          node --experimental-strip-types --input-type=module <<'NODE'
          import { assessBridgeGate } from './tools/ci/gates.ts';
          import { writeFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const target = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          const result = assessBridgeGate({ raw_handoff_status: 'complete', raw_task_done_exit_code: 0,
            transition: 'complete', target_sha: target });
          if (result.state !== 'blocked') throw new Error('Raw native completion bypassed effective gate');
          writeFileSync('tooling-output/effective-refusal.json', JSON.stringify({ ...result,
            raw_native_completion: 'preserved', effective_completion: false, canonical_tasks_completed: [],
            source: 'github-actions', run_id: process.env.GITHUB_RUN_ID, attempt: Number(process.env.GITHUB_RUN_ATTEMPT),
            target_sha: target }, null, 2) + '\n');
          NODE
          cp "$workspace/task-1-tests.log" tooling-output/raw-task-command.log
      - if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: bootstrap-tooling-${{ github.run_id }}-${{ github.run_attempt }}
          path: tooling-output/
          if-no-files-found: error
          retention-days: 7
