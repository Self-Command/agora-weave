name: Shared approved check-set execution
on:
  workflow_call:
permissions:
  contents: read
  actions: read
env:
  GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
jobs:
  install:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.23.3
          cache: npm
          cache-dependency-path: |
            package-lock.json
            infra/ci/toolchain-lock.json
      - name: Check frozen checkout dependencies and bootstrap scope
        shell: bash
        run: |
          set -eu
          mkdir -p install-output
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { readFileSync, writeFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const lock = JSON.parse(readFileSync('infra/ci/toolchain-lock.json', 'utf8'));
          const actualLock = createHash('sha256').update(readFileSync('package-lock.json')).digest('hex');
          if (actualLock !== lock.lock_sha256 || process.version !== lock.node) throw new Error('Frozen toolchain differs');
          const sha = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          if (sha !== (process.env.GITHUB_HEAD_SHA || process.env.GITHUB_SHA)) throw new Error('Unexpected actual checkout');
          writeFileSync('install-output/identity.json', JSON.stringify({ checkout_sha: sha,
            source: 'github-actions', runner_environment: process.env.RUNNER_ENVIRONMENT,
            run_id: process.env.GITHUB_RUN_ID, attempt: Number(process.env.GITHUB_RUN_ATTEMPT),
            package_lock_sha256: actualLock, node: process.version, scope: 'bootstrap-only',
            check_set_digest: createHash('sha256').update(readFileSync('tools/ci/validation-manifest.json')).digest('hex'),
            toolchain_digest: createHash('sha256').update(readFileSync('infra/ci/toolchain-lock.json')).digest('hex'),
            readiness: 'not_evaluated',
          }, null, 2) + '\n');
          NODE
          npm run ci:install > install-output/install.log 2>&1
          npm run ci:typecheck > install-output/typecheck.log 2>&1 || { cat install-output/typecheck.log; exit 1; }
          mkdir -p lint-output
          npm run ci:lint
          cp lint-output/report.json install-output/lint-report.json
        env:
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      - if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: verify-install-${{ github.run_id }}-${{ github.run_attempt }}
          path: install-output/
          if-no-files-found: error
          retention-days: 7
  service:
    needs: install
    uses: ./.github/workflows/service-bootstrap.yml
    secrets: inherit
  discover:
    needs: [install, service]
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.23.3
          cache: npm
          cache-dependency-path: |
            package-lock.json
            infra/ci/toolchain-lock.json
      - name: Install discover and execute approved nonempty targets
        run: |
          npm run ci:install
          npm run ci:discover
          npm run ci:run
      - if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: verify-checkset-${{ github.run_id }}-${{ github.run_attempt }}
          path: check-output/
          if-no-files-found: error
          retention-days: 7
  web:
    needs: discover
    uses: ./.github/workflows/web-bootstrap.yml
  native:
    needs: discover
    uses: ./.github/workflows/native-bootstrap.yml
    with:
      https_required: true
    secrets: inherit
  ingress:
    needs: discover
    uses: ./.github/workflows/service-bootstrap.yml
    with:
      https_ingress: true
    secrets: inherit
  tooling:
    needs: discover
    uses: ./.github/workflows/tooling-bootstrap.yml
  tdd:
    needs: discover
    uses: ./.github/workflows/tdd-cycle.yml
  bridge:
    needs: install
    uses: ./.github/workflows/bridge-admission.yml
  reports:
    needs: [install, service, discover, web, native, ingress, tooling, tdd, bridge]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.23.3
          cache: npm
          cache-dependency-path: |
            package-lock.json
            infra/ci/toolchain-lock.json
      - name: Preserve all executor job outcomes before aggregation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --no-tags origin 665fffada2dd4fb908b53ad7ca16159ce5e263d8
          npm run ci:evidence
      - if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: verify-executor-outcomes-${{ github.run_id }}-${{ github.run_attempt }}
          path: verify-output/
          if-no-files-found: error
          retention-days: 7
  archive:
    needs: [reports, review]
    if: ${{ always() }}
    uses: ./.github/workflows/archive-bootstrap.yml
    with:
      source_run_id: ${{ github.run_id }}
      source_sha: ${{ github.event.pull_request.head.sha || github.sha }}
    secrets: inherit
  review:
    needs: reports
    if: ${{ always() }}
    uses: ./.github/workflows/review-records.yml
    secrets: inherit
  gate:
    name: agoraweave/ci-gate
    needs: [install, service, discover, web, native, ingress, tooling, tdd, bridge, reports, review, archive]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.23.3
          cache: npm
          cache-dependency-path: |
            package-lock.json
            infra/ci/toolchain-lock.json
      - name: Recompute readiness from every collected original report and frozen requirement
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          GH_TOKEN: ${{ github.token }}
        run: |
          node --experimental-strip-types tools/ci/download-source.ts "verify-executor-outcomes-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" verify-output || true
          node --experimental-strip-types tools/ci/download-source.ts "codex-record-validation-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" review-output || true
          node --experimental-strip-types tools/ci/download-source.ts "private-source-receipts-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" private-receipts || true
          node --experimental-strip-types tools/ci/aggregate-cli.ts
      - name: Privately preserve initialization readiness and completion records with exact readback
        shell: bash
        env:
          EVIDENCE_SSH_PRIVATE_KEY: ${{ secrets.EVIDENCE_SSH_PRIVATE_KEY }}
          EVIDENCE_SSH_HOST: ${{ secrets.EVIDENCE_SSH_HOST }}
          EVIDENCE_SSH_USER: ${{ secrets.EVIDENCE_SSH_USER }}
          EVIDENCE_SSH_KNOWN_HOSTS: ${{ secrets.EVIDENCE_SSH_KNOWN_HOSTS }}
        run: |
          set -eu
          umask 077
          key="$RUNNER_TEMP/completion-key"
          hosts="$RUNNER_TEMP/completion-hosts"
          batch="$RUNNER_TEMP/completion-batch"
          trap 'rm -f "$key" "$hosts" "$batch"' EXIT
          printf '%s\n' "$EVIDENCE_SSH_PRIVATE_KEY" | tr -d '\r' > "$key"
          printf '%s\n' "$EVIDENCE_SSH_KNOWN_HOSTS" | tr -d '\r' > "$hosts"
          user=$(printf '%s' "$EVIDENCE_SSH_USER" | tr -d '\r\n')
          host=$(printf '%s' "$EVIDENCE_SSH_HOST" | tr -d '\r\n')
          sha=$(git rev-parse HEAD)
          mkdir -p "$RUNNER_TEMP/completion-readback"
          for kind in completion-records ci/readiness; do
            if [ "$kind" = completion-records ]; then local_file="gate-output/completion-records/$sha.json"; else local_file=gate-output/readiness.json; fi
            test -f "$local_file"
            remote="/archive/ordinary/$kind/$sha-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json"
            printf -- '-mkdir /archive/ordinary/completion-records\n-mkdir /archive/ordinary/ci\n-mkdir /archive/ordinary/ci/readiness\nput %s %s\nget %s %s/record.json\n' "$local_file" "$remote" "$remote" "$RUNNER_TEMP/completion-readback" > "$batch"
            sftp -b "$batch" -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$hosts" -o ConnectTimeout=15 "$user@$host"
            cmp "$local_file" "$RUNNER_TEMP/completion-readback/record.json"
          done
      - if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: verify-readiness-${{ github.run_id }}-${{ github.run_attempt }}
          path: gate-output/
          if-no-files-found: error
          retention-days: 7
  development-readiness:
    needs: [install, service, discover, web]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.23.3
      - name: Read original foundational reports without waiting for the full matrix
        env:
          GH_TOKEN: ${{ github.token }}
        run: node --experimental-strip-types tools/ci/write-development-readiness.ts
      - if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: development-readiness-${{ github.run_id }}-${{ github.run_attempt }}
          path: development-output/
          if-no-files-found: error
          retention-days: 7
