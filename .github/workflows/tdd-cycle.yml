name: Authenticated TDD cycle journal
on:
  push:
    paths:
      - '.github/workflows/tdd-cycle.yml'
      - 'tools/ci/tdd-journal.ts'
      - 'infra/ci/tdd-source-catalog.json'
  workflow_call:
permissions:
  contents: read
  actions: read
jobs:
  journal:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.23.3
      - name: Wait for current source artifacts and execute actual TDD journal
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          source=$(gh run list --repo "$GITHUB_REPOSITORY" --commit "${{ github.event.pull_request.head.sha || github.sha }}" --workflow ci-bootstrap.yml --json databaseId --jq '.[0].databaseId')
          test -n "$source"
          gh run watch "$source" --repo "$GITHUB_REPOSITORY" --interval 10
          npm run ci:tdd
      - if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: tdd-journal-${{ github.run_id }}-${{ github.run_attempt }}
          path: tdd-output/
          if-no-files-found: error
          retention-days: 7
