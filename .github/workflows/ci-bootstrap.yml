name: CI bootstrap

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  actions: read
env:
  GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

jobs:
  freeze:
    name: Cloud dependency and shell checks (not ci-ready)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install fixed Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.3
          cache: npm
          cache-dependency-path: |
            package-lock.json
            infra/ci/toolchain-lock.json
      - name: Verify official Compose source blobs
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { readFileSync } from 'node:fs';
          const source = JSON.parse(readFileSync('infra/ci/supabase-source.json', 'utf8'));
          for (const file of source.files) {
            const bytes = readFileSync(`supabase/upstream/docker/${file.path}`);
            const actual = createHash('sha1').update(`blob ${bytes.length}\0`).update(bytes).digest('hex');
            if (actual !== file.sha) throw new Error(`Official source mismatch: ${file.path}`);
          }
          console.log(`Verified ${source.files.length} official Docker source files at ${source.commit}`);
          NODE
      - name: Resolve initial lock in Actions only
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          const expected = JSON.parse(readFileSync('infra/ci/toolchain-lock.json', 'utf8'));
          const digest = createHash('sha256').update(readFileSync('package-lock.json')).digest('hex');
          if (digest !== expected.lock_sha256 || process.version !== expected.node) throw new Error('Frozen lock/toolchain mismatch');
          NODE
            if [ -f infra/ci/dependency-freeze-request.json ]; then
              node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          const request = JSON.parse(readFileSync('infra/ci/dependency-freeze-request.json', 'utf8'));
          const root = JSON.parse(readFileSync('package.json', 'utf8'));
          const previous = createHash('sha256').update(readFileSync('package-lock.json')).digest('hex');
          const allowed = { eslint: '10.12.0', '@eslint/js': '10.0.1', 'typescript-eslint': '8.71.2', ajv: '8.20.0', 'ajv-formats': '3.0.1' };
          if (request.scope !== 'bootstrap-test-tool-extension' || request.previous_lock_sha256 !== previous ||
            !request.packages || Object.keys(request.packages).length !== Object.keys(allowed).length ||
            Object.entries(allowed).some(([name, version]) => request.packages[name] !== version || root.devDependencies?.[name] !== version)) {
            throw new Error('Unmatched cloud dependency freeze request');
          }
          NODE
              npm install --package-lock-only --ignore-scripts --no-audit --no-fund
            fi
            npm ci --no-audit --no-fund
          else
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          fi
          mkdir -p freeze-output
          cp package-lock.json freeze-output/package-lock.json
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          import { createHash } from 'node:crypto';
          const lock = JSON.parse(readFileSync('package-lock.json', 'utf8'));
          const record = {
            schema_version: 1, scope: 'bootstrap-initial-resolution', readiness: 'not_evaluated',
            checkout_sha: execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim(),
            run_id: process.env.GITHUB_RUN_ID, attempt: process.env.GITHUB_RUN_ATTEMPT,
            node: process.version, npm: execFileSync('npm', ['--version'], { encoding: 'utf8' }).trim(),
            runner_image: process.env.ImageVersion, runner_os: process.env.RUNNER_OS,
            lockfile_version: lock.lockfileVersion,
            lock_sha256: createHash('sha256').update(readFileSync('package-lock.json')).digest('hex'),
            workflow_actions: {
              checkout: '3d3c42e5aac5ba805825da76410c181273ba90b1',
              setup_node: '249970729cb0ef3589644e2896645e5dc5ba9c38',
              upload_artifact: 'cf430e030ddbb5b0abf93d22962f4752f3646cd9',
            },
            created_at: new Date().toISOString(),
          };
          writeFileSync('freeze-output/toolchain-lock.json', JSON.stringify(record, null, 2) + '\n');
          NODE
      - name: Typecheck the frozen workspaces and evidence implementation
        if: ${{ hashFiles('infra/ci/toolchain-lock.json') != '' }}
        shell: bash
        run: npm run ci:typecheck > freeze-output/typecheck.log 2>&1 || { cat freeze-output/typecheck.log; exit 1; }
      - name: Discover and execute the actual approved nonempty engineering set
        if: ${{ hashFiles('tools/ci/validation-manifest.json') != '' }}
        shell: bash
        run: |
          npm run ci:discover
          npm run ci:run
      - name: Run the actual independent linter
        run: |
          mkdir -p lint-output
          npm run ci:lint
      - if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: bootstrap-lint-${{ github.run_id }}-${{ github.run_attempt }}
          path: lint-output/
          if-no-files-found: error
          retention-days: 7
      - name: Preserve discovery and original execution report
        if: ${{ always() && hashFiles('tools/ci/validation-manifest.json') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bootstrap-checkset-${{ github.run_id }}-${{ github.run_attempt }}
          path: check-output/
          if-no-files-found: error
          retention-days: 7
      - name: Build both real Web shells
        if: ${{ hashFiles('infra/ci/toolchain-lock.json') != '' }}
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        shell: bash
        run: npm run ci:build:web > freeze-output/web-build.log 2>&1 || { cat freeze-output/web-build.log; exit 1; }
      - name: Execute real browser shells and collect navigation traces
        if: ${{ hashFiles('tests/e2e/bootstrap/playwright.config.ts') != '' }}
        shell: bash
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          set -eu
          mkdir -p web-output
          node --experimental-strip-types tools/ci/write-runtime-identity.ts web-output
          npx --no-install playwright install --with-deps chromium > web-output/browser-install.log 2>&1
          npx --no-install playwright --version > web-output/playwright-version.txt
          export CHECKOUT_SHA=$(git rev-parse HEAD)
          npm run ci:e2e:web > web-output/web-test.log 2>&1 || { cat web-output/web-test.log; exit 1; }
      - name: Preserve real Web shell execution and captures
        if: ${{ always() && hashFiles('tests/e2e/bootstrap/playwright.config.ts') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bootstrap-web-${{ github.run_id }}-${{ github.run_attempt }}
          path: web-output/
          if-no-files-found: error
          retention-days: 7
      - name: Return first cloud resolution for reviewed commit
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bootstrap-freeze-${{ github.run_id }}-${{ github.run_attempt }}
          path: freeze-output/
          if-no-files-found: error
          retention-days: 7

  image-freeze:
    name: Freeze official image identities (not ci-ready)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Resolve official default image set
        shell: bash
        run: |
          mkdir -p image-output
          docker compose version > image-output/compose-version.txt
          docker compose --project-directory supabase/upstream/docker \
            --env-file supabase/upstream/docker/.env.example \
            -f supabase/upstream/docker/docker-compose.yml config --images | sort -u > image-output/images.txt
          test -s image-output/images.txt
          while IFS= read -r image; do
            docker pull "$image"
          done < image-output/images.txt
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const images = readFileSync('image-output/images.txt', 'utf8').trim().split('\n').map(reference => {
            const [data] = JSON.parse(execFileSync('docker', ['image', 'inspect', reference], { encoding: 'utf8' }));
            if (!data.RepoDigests?.length) throw new Error('Image digest missing');
            return { reference, repo_digests: data.RepoDigests, image_id: data.Id,
              architecture: data.Architecture, os: data.Os };
          });
          writeFileSync('image-output/images.lock.json', JSON.stringify({
            schema_version: 1, upstream_commit: '564eab8ad7840b13324f68b1bfac074ef8d51c21',
            checkout_sha: execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim(),
            run_id: process.env.GITHUB_RUN_ID, attempt: process.env.GITHUB_RUN_ATTEMPT,
            scope: 'official-default-linux-images', readiness: 'not_evaluated', images,
          }, null, 2) + '\n');
          NODE
      - name: Return cloud image identities
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bootstrap-images-${{ github.run_id }}-${{ github.run_attempt }}
          path: image-output/
          if-no-files-found: error
          retention-days: 7

  transport:
    name: Bootstrap transport (not ci-ready)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      EVENT_SHA: ${{ github.sha }}
      EVENT_NAME: ${{ github.event_name }}
      EVENT_REPOSITORY: ${{ github.repository }}
      RUN_ID: ${{ github.run_id }}
      RUN_ATTEMPT: ${{ github.run_attempt }}
    steps:
      - name: Checkout exact target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Install fixed Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.3
          cache: npm
          cache-dependency-path: |
            package-lock.json
            infra/ci/toolchain-lock.json
      - name: Collect transport health
        id: health
        shell: bash
        run: |
          mkdir -p bootstrap-output
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { createHash } from 'node:crypto';
          import { readFileSync, writeFileSync } from 'node:fs';
          import os from 'node:os';
          const actual = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          const hashes = Object.fromEntries([
            '.specify/memory/constitution.md',
            'specs/001-agoraweave-v1/spec.md',
            'specs/001-agoraweave-v1/plan.md',
            'specs/001-agoraweave-v1/tasks.md',
          ].map(path => [path, createHash('sha256').update(readFileSync(path)).digest('hex')]));
          const report = {
            schema_version: 1, scope: 'bootstrap-transport', readiness: 'not_evaluated',
            target_sha: process.env.TARGET_SHA, checkout_sha: actual,
            event_sha: process.env.EVENT_SHA, event: process.env.EVENT_NAME,
            repository: process.env.EVENT_REPOSITORY,
            run_id: process.env.RUN_ID, attempt: process.env.RUN_ATTEMPT,
            node: process.version, os: os.platform(), architecture: os.arch(),
            contract_digests: hashes, collected_at: new Date().toISOString(),
          };
          writeFileSync('bootstrap-output/transport.json', JSON.stringify(report, null, 2) + '\n');
          if (actual !== process.env.TARGET_SHA || process.version !== 'v22.23.3') {
            console.error('Transport target/toolchain mismatch');
            process.exitCode = 1;
          }
          NODE
      - name: Execute engineering evidence assertions
        id: assertions
        shell: bash
        run: |
          npm run ci:install
          set +e
          node --experimental-strip-types --test --test-reporter=tap \
            tests/contract/ci/*.spec.ts tests/integration/ci/*.spec.ts tests/security/ci/*.spec.ts \
            > bootstrap-output/engineering.tap 2>&1
          raw_exit=$?
          set -e
          cat bootstrap-output/engineering.tap
          printf '%s\n' "$raw_exit" > bootstrap-output/assertions-exit-code.txt
          exit "$raw_exit"
      - name: Save raw step outcome
        if: ${{ always() }}
        shell: bash
        env:
          HEALTH_OUTCOME: ${{ steps.health.outcome }}
          ASSERTIONS_OUTCOME: ${{ steps.assertions.outcome }}
        run: |
          mkdir -p bootstrap-output
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          writeFileSync('bootstrap-output/outcome.json', JSON.stringify({
            outcome: process.env.HEALTH_OUTCOME || 'missing',
            assertions_outcome: process.env.ASSERTIONS_OUTCOME || 'missing',
            run_id: process.env.RUN_ID, attempt: process.env.RUN_ATTEMPT,
            readiness: 'not_evaluated',
          }, null, 2) + '\n');
          NODE
      - name: Upload public synthetic transport evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bootstrap-transport-${{ github.run_id }}-${{ github.run_attempt }}
          path: bootstrap-output/
          if-no-files-found: error
          retention-days: 7

  collect-source:
    name: Authenticate actual raw source (not ci-ready)
    needs: transport
    if: ${{ always() && github.event_name == 'push' && github.repository == 'Self-Command/agora-weave' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout exact collector implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install fixed collection Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.3
          cache: npm
          cache-dependency-path: |
            package-lock.json
            infra/ci/toolchain-lock.json
      - name: Fetch every actual attempt and verify downloaded archive bytes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --experimental-strip-types --input-type=module <<'NODE'
          import { writeFileSync, mkdirSync } from 'node:fs';
          import { collectEvidence } from './tools/ci/collect-evidence.ts';
          const result = await collectEvidence({
            repository: process.env.GITHUB_REPOSITORY, run_id: process.env.GITHUB_RUN_ID,
            expected_sha: process.env.GITHUB_SHA, expected_attempt: Number(process.env.GITHUB_RUN_ATTEMPT),
            workflow_path: '.github/workflows/ci-bootstrap.yml',
            artifact_name: `bootstrap-transport-${process.env.GITHUB_RUN_ID}-${process.env.GITHUB_RUN_ATTEMPT}`,
            token: process.env.GH_TOKEN,
          });
          mkdirSync('source-output', { recursive: true });
          const { archive, source_run, attempts, ...receipt } = result;
          writeFileSync('source-output/source-receipt.json', JSON.stringify({ ...receipt,
            checkout_sha: process.env.GITHUB_SHA, run_id: process.env.GITHUB_RUN_ID,
            attempt: Number(process.env.GITHUB_RUN_ATTEMPT), readiness: 'not_evaluated',
            source_attempts: attempts?.map(item => ({ run_id: item.id, attempt: item.run_attempt,
              head_sha: item.head_sha, status: item.status, conclusion: item.conclusion })),
          }, null, 2) + '\n');
          if (result.state !== 'verified_source') throw new Error(`Source authentication blocked: ${result.reason_codes.join(',')}`);
          NODE
      - name: Preserve actual source authentication receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bootstrap-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: source-output/
          if-no-files-found: error
          retention-days: 7

  archive:
    name: Private complete bootstrap archive
    needs: [freeze, image-freeze, transport, collect-source]
    if: ${{ always() && github.event_name == 'push' && github.repository == 'Self-Command/agora-weave' }}
    uses: ./.github/workflows/archive-bootstrap.yml
    with:
      source_run_id: ${{ github.run_id }}
      source_sha: ${{ github.sha }}
    secrets: inherit
  gate:
    name: agoraweave/ci-gate
    needs: [freeze, image-freeze, transport, collect-source, archive]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.23.3
          cache: npm
          cache-dependency-path: |
            package-lock.json
            infra/ci/toolchain-lock.json
      - name: Authenticate the current shared executor and recompute every frozen requirement
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -eu
          source=$(gh run list --repo "$GITHUB_REPOSITORY" --commit "$TARGET_SHA" --workflow verify-release.yml --event "$GITHUB_EVENT_NAME" --branch "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" --json databaseId --jq 'if length == 1 then .[0].databaseId else empty end')
          mkdir -p gate-output
          if [ -z "$source" ]; then
            printf '{"state":"blocked","reason_codes":["missing_or_ambiguous_current_shared_executor"],"target_sha":"%s","feature_complete":false}\n' "$TARGET_SHA" > gate-output/readiness.json
            exit 1
          fi
          export SOURCE_RUN_ID="$source"
          export SOURCE_SHA="$TARGET_SHA"
          node --experimental-strip-types tools/ci/wait-shared-cli.ts
          attempt=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$source" --jq .run_attempt)
          node --experimental-strip-types tools/ci/download-source.ts "verify-executor-outcomes-$source-$attempt" verify-output || true
          node --experimental-strip-types tools/ci/download-source.ts "codex-record-validation-$source-$attempt" review-output || true
          node --experimental-strip-types tools/ci/download-source.ts "private-source-receipts-$source-$attempt" private-receipts || true
          node --experimental-strip-types tools/ci/aggregate-cli.ts
      - if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: bootstrap-readiness-${{ github.run_id }}-${{ github.run_attempt }}
          path: gate-output/
          if-no-files-found: error
          retention-days: 7
