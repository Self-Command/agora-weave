name: CI bootstrap

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  transport:
    name: Bootstrap transport (not ci-ready)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      EVENT_SHA: ${{ github.sha }}
      EVENT_NAME: ${{ github.event_name }}
      EVENT_REPOSITORY: ${{ github.repository }}
      RUN_ID: ${{ github.run_id }}
      RUN_ATTEMPT: ${{ github.run_attempt }}
    steps:
      - name: Checkout exact target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Install fixed Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.3
      - name: Collect transport health
        id: health
        shell: bash
        run: |
          mkdir -p bootstrap-output
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { createHash } from 'node:crypto';
          import { readFileSync, writeFileSync } from 'node:fs';
          import os from 'node:os';
          const actual = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          const hashes = Object.fromEntries([
            '.specify/memory/constitution.md',
            'specs/001-agoraweave-v1/spec.md',
            'specs/001-agoraweave-v1/plan.md',
            'specs/001-agoraweave-v1/tasks.md',
          ].map(path => [path, createHash('sha256').update(readFileSync(path)).digest('hex')]));
          const report = {
            schema_version: 1, scope: 'bootstrap-transport', readiness: 'not_evaluated',
            target_sha: process.env.TARGET_SHA, checkout_sha: actual,
            event_sha: process.env.EVENT_SHA, event: process.env.EVENT_NAME,
            repository: process.env.EVENT_REPOSITORY,
            run_id: process.env.RUN_ID, attempt: process.env.RUN_ATTEMPT,
            node: process.version, os: os.platform(), architecture: os.arch(),
            contract_digests: hashes, collected_at: new Date().toISOString(),
          };
          writeFileSync('bootstrap-output/transport.json', JSON.stringify(report, null, 2) + '\n');
          if (actual !== process.env.TARGET_SHA || process.version !== 'v22.23.3') {
            console.error('Transport target/toolchain mismatch');
            process.exitCode = 1;
          }
          NODE
      - name: Save raw step outcome
        if: ${{ always() }}
        shell: bash
        env:
          HEALTH_OUTCOME: ${{ steps.health.outcome }}
        run: |
          mkdir -p bootstrap-output
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          writeFileSync('bootstrap-output/outcome.json', JSON.stringify({
            outcome: process.env.HEALTH_OUTCOME || 'missing',
            run_id: process.env.RUN_ID, attempt: process.env.RUN_ATTEMPT,
            readiness: 'not_evaluated',
          }, null, 2) + '\n');
          NODE
      - name: Upload public synthetic transport evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bootstrap-transport-${{ github.run_id }}-${{ github.run_attempt }}
          path: bootstrap-output/
          if-no-files-found: error
          retention-days: 7
