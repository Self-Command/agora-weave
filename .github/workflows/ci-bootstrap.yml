name: CI bootstrap

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  freeze:
    name: Cloud dependency and shell checks (not ci-ready)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install fixed Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.3
      - name: Verify official Compose source blobs
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { readFileSync } from 'node:fs';
          const source = JSON.parse(readFileSync('infra/ci/supabase-source.json', 'utf8'));
          for (const file of source.files) {
            const bytes = readFileSync(`supabase/upstream/docker/${file.path}`);
            const actual = createHash('sha1').update(`blob ${bytes.length}\0`).update(bytes).digest('hex');
            if (actual !== file.sha) throw new Error(`Official source mismatch: ${file.path}`);
          }
          console.log(`Verified ${source.files.length} official Docker source files at ${source.commit}`);
          NODE
      - name: Resolve initial lock in Actions only
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          const expected = JSON.parse(readFileSync('infra/ci/toolchain-lock.json', 'utf8'));
          const digest = createHash('sha256').update(readFileSync('package-lock.json')).digest('hex');
          if (digest !== expected.lock_sha256 || process.version !== expected.node) throw new Error('Frozen lock/toolchain mismatch');
          NODE
            if [ -f infra/ci/dependency-freeze-request.json ]; then
              node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          const request = JSON.parse(readFileSync('infra/ci/dependency-freeze-request.json', 'utf8'));
          const root = JSON.parse(readFileSync('package.json', 'utf8'));
          const previous = createHash('sha256').update(readFileSync('package-lock.json')).digest('hex');
          if (request.scope !== 'bootstrap-test-tool-extension' || request.previous_lock_sha256 !== previous ||
            request.package !== '@playwright/test' || root.devDependencies?.[request.package] !== request.version) {
            throw new Error('Unmatched cloud dependency freeze request');
          }
          NODE
              npm install --package-lock-only --ignore-scripts --no-audit --no-fund
            fi
            npm ci --no-audit --no-fund
          else
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          fi
          mkdir -p freeze-output
          cp package-lock.json freeze-output/package-lock.json
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          import { createHash } from 'node:crypto';
          const lock = JSON.parse(readFileSync('package-lock.json', 'utf8'));
          const record = {
            schema_version: 1, scope: 'bootstrap-initial-resolution', readiness: 'not_evaluated',
            checkout_sha: execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim(),
            run_id: process.env.GITHUB_RUN_ID, attempt: process.env.GITHUB_RUN_ATTEMPT,
            node: process.version, npm: execFileSync('npm', ['--version'], { encoding: 'utf8' }).trim(),
            runner_image: process.env.ImageVersion, runner_os: process.env.RUNNER_OS,
            lockfile_version: lock.lockfileVersion,
            lock_sha256: createHash('sha256').update(readFileSync('package-lock.json')).digest('hex'),
            workflow_actions: {
              checkout: '3d3c42e5aac5ba805825da76410c181273ba90b1',
              setup_node: '249970729cb0ef3589644e2896645e5dc5ba9c38',
              upload_artifact: 'cf430e030ddbb5b0abf93d22962f4752f3646cd9',
            },
            created_at: new Date().toISOString(),
          };
          writeFileSync('freeze-output/toolchain-lock.json', JSON.stringify(record, null, 2) + '\n');
          NODE
      - name: Typecheck the frozen workspaces and evidence implementation
        if: ${{ hashFiles('infra/ci/toolchain-lock.json') != '' }}
        shell: bash
        run: npm run ci:typecheck > freeze-output/typecheck.log 2>&1 || { cat freeze-output/typecheck.log; exit 1; }
      - name: Discover and execute the actual approved nonempty engineering set
        if: ${{ hashFiles('tools/ci/validation-manifest.json') != '' }}
        shell: bash
        run: |
          npm run ci:discover
          npm run ci:run
      - name: Preserve discovery and original execution report
        if: ${{ always() && hashFiles('tools/ci/validation-manifest.json') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bootstrap-checkset-${{ github.run_id }}-${{ github.run_attempt }}
          path: check-output/
          if-no-files-found: error
          retention-days: 7
      - name: Build both real Web shells
        if: ${{ hashFiles('infra/ci/toolchain-lock.json') != '' }}
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        shell: bash
        run: npm run ci:build:web > freeze-output/web-build.log 2>&1 || { cat freeze-output/web-build.log; exit 1; }
      - name: Execute real browser shells and collect navigation traces
        if: ${{ hashFiles('tests/e2e/bootstrap/playwright.config.ts') != '' }}
        shell: bash
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          set -eu
          mkdir -p web-output
          npx --no-install playwright install --with-deps chromium > web-output/browser-install.log 2>&1
          npx --no-install playwright --version > web-output/playwright-version.txt
          export CHECKOUT_SHA=$(git rev-parse HEAD)
          npm run ci:e2e:web > web-output/web-test.log 2>&1 || { cat web-output/web-test.log; exit 1; }
      - name: Preserve real Web shell execution and captures
        if: ${{ always() && hashFiles('tests/e2e/bootstrap/playwright.config.ts') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bootstrap-web-${{ github.run_id }}-${{ github.run_attempt }}
          path: web-output/
          if-no-files-found: error
          retention-days: 7
      - name: Return first cloud resolution for reviewed commit
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bootstrap-freeze-${{ github.run_id }}-${{ github.run_attempt }}
          path: freeze-output/
          if-no-files-found: error
          retention-days: 7

  image-freeze:
    name: Freeze official image identities (not ci-ready)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Resolve official default image set
        shell: bash
        run: |
          mkdir -p image-output
          docker compose version > image-output/compose-version.txt
          docker compose --project-directory supabase/upstream/docker \
            --env-file supabase/upstream/docker/.env.example \
            -f supabase/upstream/docker/docker-compose.yml config --images | sort -u > image-output/images.txt
          test -s image-output/images.txt
          while IFS= read -r image; do
            docker pull "$image"
          done < image-output/images.txt
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const images = readFileSync('image-output/images.txt', 'utf8').trim().split('\n').map(reference => {
            const [data] = JSON.parse(execFileSync('docker', ['image', 'inspect', reference], { encoding: 'utf8' }));
            if (!data.RepoDigests?.length) throw new Error('Image digest missing');
            return { reference, repo_digests: data.RepoDigests, image_id: data.Id,
              architecture: data.Architecture, os: data.Os };
          });
          writeFileSync('image-output/images.lock.json', JSON.stringify({
            schema_version: 1, upstream_commit: '564eab8ad7840b13324f68b1bfac074ef8d51c21',
            checkout_sha: execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim(),
            run_id: process.env.GITHUB_RUN_ID, attempt: process.env.GITHUB_RUN_ATTEMPT,
            scope: 'official-default-linux-images', readiness: 'not_evaluated', images,
          }, null, 2) + '\n');
          NODE
      - name: Return cloud image identities
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bootstrap-images-${{ github.run_id }}-${{ github.run_attempt }}
          path: image-output/
          if-no-files-found: error
          retention-days: 7

  transport:
    name: Bootstrap transport (not ci-ready)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      EVENT_SHA: ${{ github.sha }}
      EVENT_NAME: ${{ github.event_name }}
      EVENT_REPOSITORY: ${{ github.repository }}
      RUN_ID: ${{ github.run_id }}
      RUN_ATTEMPT: ${{ github.run_attempt }}
    steps:
      - name: Checkout exact target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Install fixed Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.3
      - name: Collect transport health
        id: health
        shell: bash
        run: |
          mkdir -p bootstrap-output
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { createHash } from 'node:crypto';
          import { readFileSync, writeFileSync } from 'node:fs';
          import os from 'node:os';
          const actual = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          const hashes = Object.fromEntries([
            '.specify/memory/constitution.md',
            'specs/001-agoraweave-v1/spec.md',
            'specs/001-agoraweave-v1/plan.md',
            'specs/001-agoraweave-v1/tasks.md',
          ].map(path => [path, createHash('sha256').update(readFileSync(path)).digest('hex')]));
          const report = {
            schema_version: 1, scope: 'bootstrap-transport', readiness: 'not_evaluated',
            target_sha: process.env.TARGET_SHA, checkout_sha: actual,
            event_sha: process.env.EVENT_SHA, event: process.env.EVENT_NAME,
            repository: process.env.EVENT_REPOSITORY,
            run_id: process.env.RUN_ID, attempt: process.env.RUN_ATTEMPT,
            node: process.version, os: os.platform(), architecture: os.arch(),
            contract_digests: hashes, collected_at: new Date().toISOString(),
          };
          writeFileSync('bootstrap-output/transport.json', JSON.stringify(report, null, 2) + '\n');
          if (actual !== process.env.TARGET_SHA || process.version !== 'v22.23.3') {
            console.error('Transport target/toolchain mismatch');
            process.exitCode = 1;
          }
          NODE
      - name: Execute engineering evidence assertions
        id: assertions
        shell: bash
        run: |
          set +e
          node --experimental-strip-types --test --test-reporter=tap \
            tests/contract/ci/*.spec.ts tests/integration/ci/*.spec.ts tests/security/ci/*.spec.ts \
            > bootstrap-output/engineering.tap 2>&1
          raw_exit=$?
          set -e
          cat bootstrap-output/engineering.tap
          printf '%s\n' "$raw_exit" > bootstrap-output/assertions-exit-code.txt
          exit "$raw_exit"
      - name: Save raw step outcome
        if: ${{ always() }}
        shell: bash
        env:
          HEALTH_OUTCOME: ${{ steps.health.outcome }}
          ASSERTIONS_OUTCOME: ${{ steps.assertions.outcome }}
        run: |
          mkdir -p bootstrap-output
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          writeFileSync('bootstrap-output/outcome.json', JSON.stringify({
            outcome: process.env.HEALTH_OUTCOME || 'missing',
            assertions_outcome: process.env.ASSERTIONS_OUTCOME || 'missing',
            run_id: process.env.RUN_ID, attempt: process.env.RUN_ATTEMPT,
            readiness: 'not_evaluated',
          }, null, 2) + '\n');
          NODE
      - name: Upload public synthetic transport evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bootstrap-transport-${{ github.run_id }}-${{ github.run_attempt }}
          path: bootstrap-output/
          if-no-files-found: error
          retention-days: 7

  collect-source:
    name: Authenticate actual raw source (not ci-ready)
    needs: transport
    if: ${{ always() && github.event_name == 'push' && github.repository == 'Self-Command/agora-weave' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout exact collector implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install fixed collection Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.3
      - name: Fetch every actual attempt and verify downloaded archive bytes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --experimental-strip-types --input-type=module <<'NODE'
          import { writeFileSync, mkdirSync } from 'node:fs';
          import { collectEvidence } from './tools/ci/collect-evidence.ts';
          const result = await collectEvidence({
            repository: process.env.GITHUB_REPOSITORY, run_id: process.env.GITHUB_RUN_ID,
            expected_sha: process.env.GITHUB_SHA, expected_attempt: Number(process.env.GITHUB_RUN_ATTEMPT),
            workflow_path: '.github/workflows/ci-bootstrap.yml',
            artifact_name: `bootstrap-transport-${process.env.GITHUB_RUN_ID}-${process.env.GITHUB_RUN_ATTEMPT}`,
            token: process.env.GH_TOKEN,
          });
          mkdirSync('source-output', { recursive: true });
          const { archive, source_run, attempts, ...receipt } = result;
          writeFileSync('source-output/source-receipt.json', JSON.stringify({ ...receipt,
            checkout_sha: process.env.GITHUB_SHA, run_id: process.env.GITHUB_RUN_ID,
            attempt: Number(process.env.GITHUB_RUN_ATTEMPT), readiness: 'not_evaluated',
            source_attempts: attempts?.map(item => ({ run_id: item.id, attempt: item.run_attempt,
              head_sha: item.head_sha, status: item.status, conclusion: item.conclusion })),
          }, null, 2) + '\n');
          if (result.state !== 'verified_source') throw new Error(`Source authentication blocked: ${result.reason_codes.join(',')}`);
          NODE
      - name: Preserve actual source authentication receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bootstrap-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: source-output/
          if-no-files-found: error
          retention-days: 7

  archive-transport:
    name: Private raw transport archive (not ci-ready)
    needs: transport
    if: ${{ always() && github.event_name == 'push' && github.repository == 'Self-Command/agora-weave' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    env:
      TARGET_SHA: ${{ github.sha }}
    steps:
      - name: Install fixed archive Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.3
      - name: Download and verify original raw archives
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { mkdirSync, writeFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const root = 'https://api.github.com/repos/Self-Command/agora-weave';
          const headers = { Authorization: `Bearer ${process.env.GH_TOKEN}`,
            Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' };
          const sources = [
            { id: '38593654084', sha: '1c81fb28cc9d5cf16394a476a400db2b71577df9' },
            { id: '38600654805', sha: 'e02159512f0d8411d15beea0d5725c3a1cee2a22' },
            { id: '38607776284', sha: '0a45ec581e68fb1dc6a1fc16853f94ba6e78ce5a' },
            { id: process.env.GITHUB_RUN_ID, sha: process.env.TARGET_SHA },
          ];
          async function metadata(path) {
            const response = await fetch(root + path, { headers });
            if (!response.ok) throw new Error(`Metadata HTTP ${response.status}`);
            return await response.json();
          }
          mkdirSync('evidence-upload', { recursive: true });
          for (const source of sources) {
            const run = await metadata(`/actions/runs/${source.id}`);
            if (run.head_sha !== source.sha || run.event !== 'push' || run.name !== 'CI bootstrap') throw new Error('Source run mismatch');
            const jobs = await metadata(`/actions/runs/${source.id}/attempts/${run.run_attempt}/jobs?per_page=100`);
            const transport = jobs.jobs.filter(job => job.name === 'Bootstrap transport (not ci-ready)');
            if (transport.length !== 1 || transport[0].status !== 'completed') throw new Error('Source transport is not complete');
            const listing = await metadata(`/actions/runs/${source.id}/artifacts?per_page=100`);
            const matches = listing.artifacts.filter(a => !a.expired && a.name === `bootstrap-transport-${source.id}-${run.run_attempt}`);
            if (matches.length !== 1) throw new Error('Missing or ambiguous raw archive');
            const artifact = matches[0];
            const response = await fetch(`${root}/actions/artifacts/${artifact.id}/zip`, { headers });
            if (!response.ok) throw new Error(`Artifact HTTP ${response.status}`);
            const bytes = Buffer.from(await response.arrayBuffer());
            const digest = createHash('sha256').update(bytes).digest('hex');
            if (`sha256:${digest}` !== artifact.digest) throw new Error('Raw archive digest mismatch');
            const directory = `evidence-upload/${source.id}`;
            mkdirSync(directory, { recursive: true });
            const archivePath = `${directory}/source.zip`;
            writeFileSync(archivePath, bytes);
            const health = JSON.parse(execFileSync('unzip', ['-p', archivePath, 'transport.json'], { encoding: 'utf8' }));
            if (health.target_sha !== source.sha || health.checkout_sha !== source.sha || health.run_id !== source.id) throw new Error('Raw checkout identity mismatch');
            const record = {
              schema_version: 1, state: 'downloaded_and_verified', readiness: 'not_evaluated',
              repository: 'Self-Command/agora-weave', source_run: source.id,
              source_attempt: run.run_attempt, source_sha: source.sha,
              source_workflow_conclusion: run.conclusion,
              source_job_conclusion: transport[0].conclusion,
              artifact_id: artifact.id, archive_sha256: digest, archive_bytes: bytes.length,
              contract_digests: health.contract_digests,
              archive_run: process.env.GITHUB_RUN_ID, archive_attempt: process.env.GITHUB_RUN_ATTEMPT,
              retention_class: 'ordinary', retention_days: 90,
              remote_directory: `/archive/ordinary/${source.sha}_${source.id}_${run.run_attempt}_${process.env.GITHUB_RUN_ID}_${process.env.GITHUB_RUN_ATTEMPT}`,
              verified_at: new Date().toISOString(),
            };
            if (source.id === '38593654084') {
              const tap = execFileSync('unzip', ['-p', archivePath, 'engineering.tap'], { encoding: 'utf8' });
              const outcome = JSON.parse(execFileSync('unzip', ['-p', archivePath, 'outcome.json'], { encoding: 'utf8' }));
              if (outcome.outcome !== 'success' || outcome.assertions_outcome !== 'failure' || !tap.includes('# fail 30') || !tap.includes("actual: 'unknown'")) throw new Error('Observed Red source changed');
              const testDigests = {};
              for (const path of ['tests/contract/ci/evidence.spec.ts', 'tests/integration/ci/aggregate.spec.ts', 'tests/fixtures/bootstrap/evidence.ts']) {
                const file = await metadata(`/contents/${path}?ref=${source.sha}`);
                if (file.encoding !== 'base64') throw new Error('Cannot bind original test input');
                testDigests[path] = createHash('sha256').update(Buffer.from(file.content, 'base64')).digest('hex');
              }
              record.red_observation = {
                cycle_id: 'ci-evidence-001', state: 'red_observed',
                behavior_ids: ['ci.report-assessment', 'ci.required-check-aggregation'],
                requirements: ['QR-001', 'QR-003', 'QR-004', 'QR-006', 'QR-007'],
                oracle: 'Nonempty matching evidence can pass; missing, failed, mismatched or incomplete required evidence blocks',
                case_ids: ['E01', 'E02', 'E03', 'E04', 'E05', 'E06', 'E07', 'E08', 'E09', 'E10', 'E11', 'A01', 'A02', 'A03', 'A04', 'A05', 'A06', 'A07'],
                S_R: source.sha, source_run: source.id, source_attempt: run.run_attempt,
                test_fixture_digests: testDigests, expected_assertion_failures: 30,
                actual_failure: 'Callable implementation shell returns unknown instead of passed or blocked; 30 semantic assertions fail',
                red_cause_review: { reviewer: 'current-codex', session_ref: 'agoraweave-ci-bootstrap',
                  reviewed_at: '2026-10-14T16:27:00Z', health: 'success',
                  conclusion: 'Observed raw TAP and checkout health; failure is absent evidence/aggregate behavior, no import/compile/discovery/credential error' },
                green_state: 'not_implemented', raw_failure_preserved: true,
              };
            }
            if (source.id === '38600654805') {
              const tap = execFileSync('unzip', ['-p', archivePath, 'engineering.tap'], { encoding: 'utf8' });
              const outcome = JSON.parse(execFileSync('unzip', ['-p', archivePath, 'outcome.json'], { encoding: 'utf8' }));
              if (outcome.outcome !== 'success' || outcome.assertions_outcome !== 'failure' || !tap.includes('# pass 30') || !tap.includes('# fail 35')) throw new Error('Observed gate Red source changed');
              const paths = ['tests/integration/ci/verify-orchestration.spec.ts', 'tests/integration/ci/tdd-cycle.spec.ts',
                'tests/security/ci/bridge-gate.spec.ts', 'tests/security/ci/review-baseline.spec.ts', 'tests/fixtures/bootstrap/gates.ts'];
              const digests = {};
              for (const path of paths) {
                const file = await metadata(`/contents/${path}?ref=${source.sha}`);
                if (file.encoding !== 'base64') throw new Error('Cannot bind gate Red input');
                digests[path] = createHash('sha256').update(Buffer.from(file.content, 'base64')).digest('hex');
              }
              record.red_observation = {
                cycle_id: 'ci-gates-002', state: 'red_observed', S_R: source.sha,
                source_run: source.id, source_attempt: run.run_attempt,
                behavior_ids: ['ci.orchestration-graph', 'ci.tdd-cycle', 'ci.bridge-gate', 'ci.codex-review-baseline'],
                requirements: ['QR-003', 'QR-005', 'QR-007', 'QR-008', 'QR-009', 'QR-010'],
                test_fixture_digests: digests, assertion_failures: 35, existing_regressions_passed: 30,
                actual_failure: 'Four callable gate shells return unknown; semantic acceptance/rejection assertions fail',
                red_cause_review: { reviewer: 'current-codex', session_ref: 'agoraweave-ci-bootstrap',
                  reviewed_at: '2026-10-14T16:43:00Z', health: 'success',
                  conclusion: 'Read all 35 raw failures; imports/discovery healthy; prior 30 behaviors pass; target gate behavior absent' },
                green_state: 'not_implemented', raw_failure_preserved: true,
              };
            }
            if (source.id === '38607776284') {
              const tap = execFileSync('unzip', ['-p', archivePath, 'engineering.tap'], { encoding: 'utf8' });
              const outcome = JSON.parse(execFileSync('unzip', ['-p', archivePath, 'outcome.json'], { encoding: 'utf8' }));
              if (outcome.outcome !== 'success' || outcome.assertions_outcome !== 'failure' ||
                !tap.includes('# pass 65') || !tap.includes('# fail 12') || !tap.includes("actual: 'unknown'")) throw new Error('Observed collector Red source changed');
              const paths = ['tests/integration/ci/source-collection.spec.ts', 'tests/fixtures/bootstrap/source.ts'];
              const digests = {};
              for (const path of paths) {
                const file = await metadata(`/contents/${path}?ref=${source.sha}`);
                if (file.encoding !== 'base64') throw new Error('Cannot bind collector Red input');
                digests[path] = createHash('sha256').update(Buffer.from(file.content, 'base64')).digest('hex');
              }
              record.red_observation = {
                cycle_id: 'ci-source-003', state: 'red_observed', S_R: source.sha,
                source_run: source.id, source_attempt: run.run_attempt,
                behavior_ids: ['ci.source-authentication', 'ci.attempt-preservation', 'ci.raw-digest', 'ci.redirect-credential-boundary'],
                requirements: ['QR-006', 'QR-007', 'QR-009'], case_ids: ['C01', 'C02', 'C03', 'C04', 'C05'],
                test_fixture_digests: digests, assertion_failures: 12, existing_regressions_passed: 65,
                actual_failure: 'Callable collector returns unknown; all 12 source acceptance/rejection assertions fail',
                red_cause_review: { reviewer: 'current-codex', session_ref: 'agoraweave-ci-bootstrap',
                  reviewed_at: '2026-10-14T17:38:03Z', health: 'success',
                  conclusion: 'Read raw failures and healthy transport; no import/discovery/credential failure; target source authentication absent' },
                green_state: 'separate_current_evidence_required', raw_failure_preserved: true,
              };
            }
            writeFileSync(`${directory}/provenance.json`, JSON.stringify(record, null, 2) + '\n');
          }
          NODE
      - name: Transfer to dedicated SFTP storage and verify readback
        shell: bash
        env:
          EVIDENCE_SSH_PRIVATE_KEY: ${{ secrets.EVIDENCE_SSH_PRIVATE_KEY }}
          EVIDENCE_SSH_HOST: ${{ secrets.EVIDENCE_SSH_HOST }}
          EVIDENCE_SSH_USER: ${{ secrets.EVIDENCE_SSH_USER }}
          EVIDENCE_SSH_KNOWN_HOSTS: ${{ secrets.EVIDENCE_SSH_KNOWN_HOSTS }}
        run: |
          set -eu
          umask 077
          key="$RUNNER_TEMP/evidence-ssh-key"
          hosts="$RUNNER_TEMP/evidence-known-hosts"
          trap 'rm -f "$key" "$key.pub" "$hosts" "$RUNNER_TEMP/evidence-sftp-batch"' EXIT
          test -n "$EVIDENCE_SSH_PRIVATE_KEY"
          test -n "$EVIDENCE_SSH_HOST"
          test -n "$EVIDENCE_SSH_USER"
          test -n "$EVIDENCE_SSH_KNOWN_HOSTS"
          printf '%s\n' "$EVIDENCE_SSH_PRIVATE_KEY" | tr -d '\r' > "$key"
          printf '%s\n' "$EVIDENCE_SSH_KNOWN_HOSTS" | tr -d '\r' > "$hosts"
          ssh-keygen -y -P '' -f "$key" > "$key.pub"
          EVIDENCE_SSH_USER=$(printf '%s' "$EVIDENCE_SSH_USER" | tr -d '\r\n')
          EVIDENCE_SSH_HOST=$(printf '%s' "$EVIDENCE_SSH_HOST" | tr -d '\r\n')
          for directory in evidence-upload/*; do
            remote=$(node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync(process.argv[1])).remote_directory)' "$directory/provenance.json")
            mkdir -p "$directory/readback"
            printf 'mkdir %s\nput %s/source.zip %s/source.zip\nput %s/provenance.json %s/provenance.json\nget %s/source.zip %s/readback/source.zip\nget %s/provenance.json %s/readback/provenance.json\n' \
              "$remote" "$directory" "$remote" "$directory" "$remote" "$remote" "$directory" "$remote" "$directory" > "$RUNNER_TEMP/evidence-sftp-batch"
            sftp -b "$RUNNER_TEMP/evidence-sftp-batch" -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes \
              -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$hosts" -o ConnectTimeout=15 \
              "$EVIDENCE_SSH_USER@$EVIDENCE_SSH_HOST"
            cmp "$directory/source.zip" "$directory/readback/source.zip"
            cmp "$directory/provenance.json" "$directory/readback/provenance.json"
            node --input-type=module - "$directory" <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          const directory = process.argv[2];
          const provenance = JSON.parse(readFileSync(`${directory}/provenance.json`, 'utf8'));
          const actual = createHash('sha256').update(readFileSync(`${directory}/readback/source.zip`)).digest('hex');
          if (actual !== provenance.archive_sha256) throw new Error('Remote readback digest mismatch');
          writeFileSync(`${directory}/receipt.json`, JSON.stringify({ ...provenance,
            state: 'archived_raw_and_readback_verified', archived_at: new Date().toISOString(),
            meaning: 'Raw transport only; source failure remains failure; not ci-ready',
          }, null, 2) + '\n');
          NODE
            printf 'put %s/receipt.json %s/receipt.json\nget %s/receipt.json %s/readback/receipt.json\n' \
              "$directory" "$remote" "$remote" "$directory" > "$RUNNER_TEMP/evidence-sftp-batch"
            sftp -b "$RUNNER_TEMP/evidence-sftp-batch" -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes \
              -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$hosts" -o ConnectTimeout=15 \
              "$EVIDENCE_SSH_USER@$EVIDENCE_SSH_HOST"
            cmp "$directory/receipt.json" "$directory/readback/receipt.json"
          done
          printf 'Original source results archived and readback verified; readiness not evaluated\n' >> "$GITHUB_STEP_SUMMARY"
