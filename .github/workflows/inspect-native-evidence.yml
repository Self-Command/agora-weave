name: Inspect preserved native evidence
on:
  push:
    paths: ['.github/workflows/inspect-native-evidence.yml']
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Authenticate original ZIPs and extract bounded diagnostic inputs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p native-inspection
          python3 - <<'PY'
          import hashlib, io, json, os, pathlib, subprocess, zipfile
          root = pathlib.Path('native-inspection')
          for artifact_id in [11944221043, 11944131721]:
              repo = 'repos/Self-Command/agora-weave'
              metadata = json.loads(subprocess.check_output(['gh', 'api', f'{repo}/actions/artifacts/{artifact_id}']))
              archive = subprocess.check_output(['gh', 'api', f'{repo}/actions/artifacts/{artifact_id}/zip'])
              digest = 'sha256:' + hashlib.sha256(archive).hexdigest()
              if metadata['digest'] != digest:
                  raise RuntimeError('Original ZIP digest mismatch')
              target = root / str(artifact_id)
              target.mkdir()
              files = []
              with zipfile.ZipFile(io.BytesIO(archive)) as zipped:
                  expanded = sum(entry.file_size for entry in zipped.infolist())
                  for entry in zipped.infolist():
                      if entry.is_dir() or '.xcresult/' in entry.filename or entry.filename == 'ios-build.log':
                          continue
                      if not entry.filename.endswith(('.json', '.log', '.txt', '.xml', '.png')):
                          continue
                      if entry.file_size > 8 * 1024 * 1024:
                          continue
                      dest = (target / entry.filename).resolve()
                      if not dest.is_relative_to(target.resolve()):
                          raise RuntimeError('Unsafe native evidence path')
                      data = zipped.read(entry)
                      dest.parent.mkdir(parents=True, exist_ok=True)
                      dest.write_bytes(data)
                      files.append({'path': entry.filename, 'sha256': hashlib.sha256(data).hexdigest(), 'size_bytes': len(data)})
              receipt = {'artifact_id': artifact_id, 'metadata': metadata, 'original_zip_digest_verified': True,
                         'zip_bytes': len(archive), 'expanded_bytes': expanded, 'selected_files': files,
                         'diagnostic_only': True, 'readiness': 'not_evaluated'}
              (target / 'original-source-receipt.json').write_text(json.dumps(receipt, indent=2))
              print(json.dumps({'artifact_id': artifact_id, 'zip_bytes': len(archive), 'expanded_bytes': expanded,
                                'selected_file_count': len(files), 'original_zip_digest_verified': True}))
          PY
      - if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: preserved-native-inspection-${{ github.run_id }}-${{ github.run_attempt }}
          path: native-inspection/
          if-no-files-found: error
          retention-days: 7
