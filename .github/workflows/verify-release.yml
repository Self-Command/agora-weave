name: Full current validation
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.23.3
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run ci:typecheck
      - run: npm run ci:lint
      - run: npm run ci:contracts
  services:
    uses: ./.github/workflows/service-bootstrap.yml
    with:
      https_ingress: true
    secrets: inherit
  web:
    uses: ./.github/workflows/web-bootstrap.yml
  native:
    uses: ./.github/workflows/native-bootstrap.yml
    with:
      https_required: true
    secrets: inherit
