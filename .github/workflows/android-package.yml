name: Android install packages

on:
  workflow_dispatch:
    inputs:
      variant:
        description: Preview embeds JavaScript; development connects to Metro
        type: choice
        options: [preview, development]
        default: preview

permissions:
  contents: read

concurrency:
  group: android-package-${{ github.ref }}-${{ inputs.variant }}
  cancel-in-progress: true

env:
  CI: '1'
  EXPO_NO_TELEMETRY: '1'

jobs:
  package:
    name: Android ${{ matrix.abi }} ${{ inputs.variant }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, x86_64]
    steps:
      - name: Checkout selected source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install fixed Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.3
          cache: npm
      - name: Cache Gradle dependencies and build outputs
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: android-${{ runner.os }}-${{ matrix.abi }}-${{ hashFiles('package-lock.json', 'apps/mobile/app.json') }}
          restore-keys: android-${{ runner.os }}-${{ matrix.abi }}-
      - name: Prepare pinned Android tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p package-output
          test -d "$JAVA_HOME_17_X64"
          printf 'JAVA_HOME=%s\n' "$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          printf '%s/bin\n' "$JAVA_HOME_17_X64" >> "$GITHUB_PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.1.12297006' 'cmake;3.22.1' > package-output/sdk-install.log 2>&1
          "$JAVA_HOME_17_X64/bin/java" -version > package-output/java-version.txt 2>&1
      - name: Install frozen dependencies and check mobile types
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          const lock = JSON.parse(readFileSync('infra/ci/toolchain-lock.json','utf8'));
          if (process.version !== lock.node || createHash('sha256').update(readFileSync('package-lock.json')).digest('hex') !== lock.lock_sha256) throw new Error('Frozen Node or lockfile mismatch');
          NODE
          npm ci --no-audit --no-fund > package-output/npm-install.log 2>&1
          npm run typecheck --workspace apps/mobile
      - name: Build selected 64 bit install package
        env:
          PACKAGE_VARIANT: ${{ inputs.variant }}
          PACKAGE_ABI: ${{ matrix.abi }}
        shell: bash
        run: |
          set -euo pipefail
          cd apps/mobile
          npm run ci:prebuild -- --platform android > ../../package-output/prebuild.log 2>&1
          cd android
          if [ "$PACKAGE_VARIANT" = preview ]; then
            build=Release
            folder=release
          else
            build=Debug
            folder=debug
          fi
          ./gradlew ":app:assemble$build" --no-daemon --build-cache --max-workers=2 "-PreactNativeArchitectures=$PACKAGE_ABI" > ../../../package-output/gradle.log 2>&1
          cp "app/build/outputs/apk/$folder/app-$folder.apk" "../../../package-output/agoraweave-$PACKAGE_VARIANT-$PACKAGE_ABI.apk"
          cd ../../..
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "package-output/agoraweave-$PACKAGE_VARIANT-$PACKAGE_ABI.apk" > package-output/apk-metadata.txt
          grep -F "native-code: '$PACKAGE_ABI'" package-output/apk-metadata.txt
          sha256sum "package-output/agoraweave-$PACKAGE_VARIANT-$PACKAGE_ABI.apk" > package-output/SHA256SUMS
          printf 'source_sha=%s\nrun_id=%s\nvariant=%s\nabi=%s\nsigning=isolated-debug-test-key\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$PACKAGE_VARIANT" "$PACKAGE_ABI" > package-output/source.txt
      - name: Upload install package and diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-${{ inputs.variant }}-${{ matrix.abi }}-${{ github.sha }}
          path: package-output/
          if-no-files-found: error
          retention-days: 7
