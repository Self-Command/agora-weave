name: Current Codex record integrity
on:
  workflow_call:
permissions:
  contents: read
  actions: read
jobs:
  records:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.23.3
      - name: Authenticate original same-target review input context
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node --experimental-strip-types tools/ci/download-source.ts "verify-executor-outcomes-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" verify-output
      - name: Read exact private current Codex records without exposing their payloads
        shell: bash
        env:
          EVIDENCE_SSH_PRIVATE_KEY: ${{ secrets.EVIDENCE_SSH_PRIVATE_KEY }}
          EVIDENCE_SSH_HOST: ${{ secrets.EVIDENCE_SSH_HOST }}
          EVIDENCE_SSH_USER: ${{ secrets.EVIDENCE_SSH_USER }}
          EVIDENCE_SSH_KNOWN_HOSTS: ${{ secrets.EVIDENCE_SSH_KNOWN_HOSTS }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -eu
          umask 077
          mkdir -p private-review
          key="$RUNNER_TEMP/review-read-key"
          hosts="$RUNNER_TEMP/review-read-hosts"
          batch="$RUNNER_TEMP/review-read-batch"
          trap 'rm -f "$key" "$hosts" "$batch"' EXIT
          printf '%s\n' "$EVIDENCE_SSH_PRIVATE_KEY" | tr -d '\r' > "$key"
          printf '%s\n' "$EVIDENCE_SSH_KNOWN_HOSTS" | tr -d '\r' > "$hosts"
          user=$(printf '%s' "$EVIDENCE_SSH_USER" | tr -d '\r\n')
          host=$(printf '%s' "$EVIDENCE_SSH_HOST" | tr -d '\r\n')
          context=$(sha256sum verify-output/review-context.json | cut -d' ' -f1)
          for kind in code visual; do
            printf 'get /archive/ordinary/review-%s-%s-%s.json private-review/%s.json\n' "$TARGET_SHA" "$kind" "$context" "$kind" > "$batch"
            if ! sftp -b "$batch" -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$hosts" -o ConnectTimeout=15 "$user@$host" > "$RUNNER_TEMP/review-read-$kind.log" 2>&1; then
              rm -f "private-review/$kind.json"
            fi
          done
          rm -f "$key" "$hosts" "$batch"
          test ! -e "$key"
      - name: Validate current Codex statements against authenticated input bytes and actual checks
        run: npm run ci:review
      - if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: codex-record-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: review-output/
          if-no-files-found: error
          retention-days: 7
