name: API contracts and independent mocks
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'development/contracts/**'
      - 'tools/api/**'
      - 'packages/contracts/src/generated/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/api-contracts.yml'
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.23.3
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run api:check
      - name: Check three independent Prism surfaces and Specmatic interoperability
        run: npm run api:smoke -- --specmatic
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ always() }}
        with:
          name: api-contracts-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            check-output/api/**/result.json
            check-output/api/mock-smoke.json
          if-no-files-found: warn
          retention-days: 7
