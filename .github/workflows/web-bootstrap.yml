name: Shared Web shell execution
on:
  workflow_call:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.23.3
      - name: Execute installed real browser clients
        shell: bash
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          set -eu
          mkdir -p web-output
          node --experimental-strip-types tools/ci/write-runtime-identity.ts web-output
          npm run ci:install > web-output/install.log 2>&1
          npm run ci:build:web > web-output/build.log 2>&1
          npx --no-install playwright install --with-deps chromium > web-output/browser-install.log 2>&1
          export CHECKOUT_SHA=$(git rev-parse HEAD)
          npm run ci:e2e > web-output/web-test.log 2>&1 || { cat web-output/web-test.log; exit 1; }
      - name: Preserve original captures and traces
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: verify-web-${{ github.run_id }}-${{ github.run_attempt }}
          path: web-output/
          if-no-files-found: error
          retention-days: 7
