name: Publish verified Android preview

on:
  workflow_dispatch:
    inputs:
      package_run:
        description: Successful Android install packages run ID
        required: true
        type: string
      validation_run:
        description: Successful Full current validation run ID
        required: true
        type: string
      source_sha:
        description: Exact APK source commit
        required: true
        type: string
      tag:
        description: New preview release tag
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-preview-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PACKAGE_RUN: ${{ inputs.package_run }}
      VALIDATION_RUN: ${{ inputs.validation_run }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.23.3
      - name: Check exact build and applicable successful validation
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { mkdirSync } from 'node:fs';
          const api = endpoint => JSON.parse(execFileSync('gh', ['api', `repos/${process.env.GH_REPO}/${endpoint}`], {encoding:'utf8'}));
          if (!/^\d+$/.test(process.env.PACKAGE_RUN) || !/^\d+$/.test(process.env.VALIDATION_RUN) || !/^[a-f0-9]{40}$/.test(process.env.SOURCE_SHA) || !/^v[0-9][a-zA-Z0-9._-]*$/.test(process.env.RELEASE_TAG)) throw Error('Invalid release inputs');
          const existing = api(`git/matching-refs/tags/${process.env.RELEASE_TAG}`).find(ref => ref.ref === `refs/tags/${process.env.RELEASE_TAG}`);
          if (existing && existing.object.sha !== process.env.SOURCE_SHA) throw Error('Existing release tag source mismatch');
          const drafts = api('releases?per_page=100').filter(release => release.tag_name === process.env.RELEASE_TAG);
          if (drafts.length !== 1 || !drafts[0].draft || !drafts[0].prerelease || drafts[0].target_commitish !== process.env.SOURCE_SHA || drafts[0].assets.length) throw Error('One empty authorized preview draft is required; published releases are immutable');
          const build = api(`actions/runs/${process.env.PACKAGE_RUN}`);
          const validation = api(`actions/runs/${process.env.VALIDATION_RUN}`);
          if (build.path !== '.github/workflows/android-package.yml' || build.conclusion !== 'success' || build.head_sha !== process.env.SOURCE_SHA || validation.path !== '.github/workflows/verify-release.yml' || validation.conclusion !== 'success') throw Error('Exact successful build and full applicable validation required');
          const jobs = api(`actions/runs/${validation.id}/jobs?per_page=100`);
          if (jobs.total_count !== 8 || jobs.jobs.some(job => job.conclusion !== 'success')) throw Error('All eight applicable validation jobs must succeed');
          const changed = execFileSync('git', ['diff', '--name-only', validation.head_sha, process.env.SOURCE_SHA], {encoding:'utf8'}).trim().split('\n').filter(Boolean);
          const allowed = new Set(['infra/ci/toolchain-lock.json', 'tests/e2e/android/BootstrapShellTest.kt', '.github/workflows/native-bootstrap.yml', '.github/workflows/publish-android-release.yml']);
          if (changed.some(path => !allowed.has(path))) throw Error('Application source differs from validated package source');
          mkdirSync('release-output', {recursive:true});
          NODE
      - name: Download and verify both existing preview packages
        shell: bash
        run: |
          set -euo pipefail
          for abi in arm64-v8a x86_64; do
            gh run download "$PACKAGE_RUN" --name "android-preview-$abi-$SOURCE_SHA" --dir "release-output/$abi"
          done
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync, copyFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          const sums = [];
          for (const abi of ['arm64-v8a','x86_64']) {
            const folder = `release-output/${abi}`;
            const filename = `agoraweave-preview-${abi}.apk`;
            const source = Object.fromEntries(readFileSync(`${folder}/source-${abi}.txt`,'utf8').trim().split('\n').map(line => line.split('=')));
            const metadata = readFileSync(`${folder}/apk-metadata.txt`,'utf8');
            const digest = createHash('sha256').update(readFileSync(`${folder}/${filename}`)).digest('hex');
            const recorded = readFileSync(`${folder}/SHA256SUMS`,'utf8').trim().split(/\s+/)[0];
            if (source.source_sha !== process.env.SOURCE_SHA || source.run_id !== process.env.PACKAGE_RUN || source.variant !== 'preview' || source.abi !== abi || !metadata.includes(`native-code: '${abi}'`) || digest !== recorded) throw Error(`Package provenance or checksum mismatch: ${abi}`);
            copyFileSync(`${folder}/${filename}`, `release-output/${filename}`);
            sums.push(`${digest}  ${filename}`);
          }
          writeFileSync('release-output/SHA256SUMS', sums.join('\n')+'\n');
          const repo = `https://github.com/${process.env.GH_REPO}`;
          writeFileSync('release-output/notes.md', `# AgoraWeave Phase 2 基础核心测试版\n\nAndroid预览包内含JavaScript，无需Metro。arm64-v8a用于64位Android真机，x86_64用于64位Android模拟器，均为隔离测试签名。\n\n源码：${process.env.SOURCE_SHA}。\n\n[完整适用功能验证](${repo}/actions/runs/${process.env.VALIDATION_RUN})和[两种架构安装包构建](${repo}/actions/runs/${process.env.PACKAGE_RUN})均通过，包括后端dev/test、干净库和增量迁移、Web功能及当前登记的Android/iOS原生功能矩阵。构建与验证版本的差异仅限冻结锁文件摘要登记、原生测试自动化和发布工作流，应用源码相同；具体用例和平台结果见原始运行报告。\n\n视觉检查留在本地，由用户下载后自行检查。公开challenge/verify、真实短信、完整账号旅程、管理身份/MFA、后台真实业务和后续分类清理仍未完成；未配置公开认证服务时账号页显示真实服务不可用反馈。本测试版不表示全部页面视觉验收、生产部署或iOS设备IPA发布。\n\n## SHA-256\n\n\x60\x60\x60text\n${sums.join('\n')}\n\x60\x60\x60\n`);
          NODE
      - name: Upload verified assets to the authorized release draft
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" \
            release-output/agoraweave-preview-arm64-v8a.apk release-output/agoraweave-preview-x86_64.apk release-output/SHA256SUMS
          gh release edit "$RELEASE_TAG" --notes-file release-output/notes.md
      - name: Verify published tag and asset digests
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { readFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          const api = endpoint => JSON.parse(execFileSync('gh', ['api', `repos/${process.env.GH_REPO}/${endpoint}`], {encoding:'utf8'}));
          const tag = api(`git/ref/tags/${process.env.RELEASE_TAG}`);
          const releases = api('releases?per_page=100').filter(release => release.tag_name === process.env.RELEASE_TAG);
          if (releases.length !== 1) throw Error('Release draft missing or ambiguous');
          const release = releases[0];
          const files = ['agoraweave-preview-arm64-v8a.apk','agoraweave-preview-x86_64.apk','SHA256SUMS'];
          if (tag.object.sha !== process.env.SOURCE_SHA || !release.draft || !release.prerelease || release.assets.length !== files.length) throw Error('Release draft identity mismatch');
          for (const file of files) {
            const bytes = readFileSync(`release-output/${file}`);
            const asset = release.assets.find(asset => asset.name === file);
            if (!asset || asset.state !== 'uploaded' || asset.size !== bytes.length || asset.digest !== `sha256:${createHash('sha256').update(bytes).digest('hex')}`) throw Error(`Published asset digest mismatch: ${file}`);
          }
          console.log(`Verified ${release.html_url}`);
          NODE
